<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quest 3 - 데이터 선별소 (사진 업로드)</title>
  <!-- 저작권 무료 폰트: Pretendard 및 Google Fonts Jua 사용 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #2E7D32;
      --primary-light: #E8F5E9;
      --accent: #FFB300;
      --card-bg: #FFFFFF;
      --text-dark: #263238;
      --border: #C8E6C9;
      --muted: #558B2F;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #F1F8E9;
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      font-size: 18px;
    }

    .page-wrap {
      width: 100%;
      max-width: 840px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      background: #FFFFFF;
      border: 3px solid #A5D6A7;
      border-radius: 20px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 6px 16px rgba(46, 125, 50, 0.1);
    }

    .btn-back {
      background: #E8F5E9;
      border: 2px solid #A5D6A7;
      color: #2E7D32;
      padding: 10px 18px;
      border-radius: 14px;
      text-decoration: none;
      font-family: 'Jua', sans-serif;
      font-size: 18px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .header-score {
      background: #FFF9C4;
      border: 2px solid #FBC02D;
      padding: 8px 18px;
      border-radius: 16px;
      font-family: 'Jua', sans-serif;
      font-size: 20px;
      color: #F57F17;
    }

    .page-title {
      font-family: 'Jua', sans-serif;
      font-size: 30px;
      color: var(--primary);
      margin-top: 6px;
    }

    .page-desc {
      font-size: 17px;
      color: #455A64;
      font-weight: 600;
      line-height: 1.5;
    }

    .card {
      background: var(--card-bg);
      border: 3px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.04);
    }

    .card h3 {
      font-family: 'Jua', sans-serif;
      font-size: 24px;
      color: var(--primary);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .upload-zone {
      border: 3px dashed #81C784;
      border-radius: 18px;
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: all .2s;
      background: #F1F8E9;
    }

    .upload-zone:hover, .upload-zone.dragover {
      border-color: var(--primary);
      background: #E8F5E9;
      transform: scale(1.01);
    }

    .upload-zone .icon { font-size: 52px; margin-bottom: 10px; }
    .upload-zone h4 { font-family: 'Jua', sans-serif; font-size: 24px; color: var(--primary); margin-bottom: 8px; }
    .upload-zone p { font-size: 16px; font-weight: 600; color: #558B2F; }

    #file-input { display: none; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 20px;
      border: none;
      border-radius: 16px;
      font-family: 'Jua', sans-serif;
      font-size: 18px;
      cursor: pointer;
      transition: all .2s;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #4CAF50, #2E7D32);
      color: white;
      box-shadow: 0 4px 12px rgba(46, 125, 50, 0.2);
    }

    .btn-primary:active { transform: translateY(2px); }

    .btn-info {
      background: linear-gradient(135deg, #0288D1, #0277BD);
      color: white;
      box-shadow: 0 4px 12px rgba(2, 119, 189, 0.2);
    }

    .btn-ghost {
      background: #FFFFFF;
      border: 2px solid #C8E6C9;
      color: #2E7D32;
    }

    .btn-tab {
      background: #ECEFF1;
      color: #455A64;
      border: 2px solid transparent;
    }

    .btn-tab.active {
      background: #E8F5E9;
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .preview-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid var(--border);
      background: #eee;
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .remove-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(229, 57, 53, 0.9);
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status-badge {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 4px;
      font-size: 12px;
      font-weight: bold;
      text-align: center;
    }

    .status-pending { background: #FFE082; color: #5D4037; }
    .status-done { background: #A5D6A7; color: #1B5E20; }
    .status-error { background: #EF9A9A; color: #B71C1C; }

    .progress-wrap {
      background: #E0E0E0;
      border-radius: 20px;
      height: 16px;
      overflow: hidden;
      margin: 14px 0 8px 0;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #81C784, #388E3C);
      border-radius: 20px;
      transition: width .2s;
    }

    .progress-text {
      font-size: 16px;
      font-weight: 600;
      color: #2E7D32;
      margin-bottom: 12px;
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .uploaded-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      background: #F9FBE7;
      border: 2px solid #DCEDC8;
      border-radius: 16px;
      margin-bottom: 10px;
    }

    .uploaded-thumb {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid #C8E6C9;
    }

    .del-btn {
      background: #FFEBEE;
      border: 1px solid #FFCDD2;
      border-radius: 10px;
      padding: 8px 14px;
      color: #C62828;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .alert {
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .alert-success { background: #E8F5E9; border: 2px solid #81C784; color: #2E7D32; }
    .alert-error { background: #FFEBEE; border: 2px solid #E57373; color: #C62828; }
  </style>
</head>
<body>

<div class="page-wrap">
  <header>
    <a href="main.html" class="btn-back">⬅ 메인화면</a>
    <div class="header-score" id="dispScore">⭐ 0점</div>
  </header>

  <div>
    <div class="page-title">🧹 Quest 3: 데이터 선별소</div>
    <div class="page-desc">AI 학습에 사용할 수집 사진을 직접 올려보세요!<br>사진은 AI 표준 규격인 600×600px로 자동 변환됩니다.</div>
  </div>

  <div id="main-alert"></div>

  <!-- 사진 업로드 존 -->
  <div class="card">
    <h3>📸 사진 업로드</h3>
    <div class="upload-zone" id="upload-zone"
      onclick="document.getElementById('file-input').click()"
      ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropFiles(event)">
      <div class="icon">📸</div>
      <h4>사진을 여기에 끌어다 놓거나 클릭하여 선택하세요!</h4>
      <p>JPG, PNG, WEBP 지원 · 600×600 자동 변환 · 최대 20장</p>
    </div>
    <input type="file" id="file-input" accept="image/*" multiple onchange="handleFiles(this.files)">

    <div id="pending-card" style="display:none; margin-top:16px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px;">
        <span style="font-size:17px; font-weight:bold; color:#2E7D32;">대기 중인 사진: <strong id="pending-count">0</strong>장</span>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-primary" id="upload-btn" onclick="uploadAll()">☁️ 업로드 시작</button>
          <button class="btn btn-ghost" onclick="clearPending()">초기화</button>
        </div>
      </div>

      <div class="preview-grid" id="preview-grid"></div>

      <div class="progress-wrap" id="progress-wrap" style="display:none;">
        <div class="progress-bar" id="progress-bar" style="width:0%;"></div>
      </div>
      <div class="progress-text" id="upload-status"></div>
    </div>
  </div>

  <!-- 올린 사진 목록 및 팀 활동 내역 -->
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;">
      <h3 style="margin:0;">☁️ 사진 데이터 목록 (<span id="my-count">0</span>장)</h3>
      <a href="quest4.html" class="btn btn-primary" style="font-size:17px;">라벨링 체육관 가기 🏷️</a>
    </div>

    <!-- 탭 전환 바 (내 사진 / 팀 모둠 사진) -->
    <div class="filter-bar">
      <button class="btn btn-tab active" id="tab-my" onclick="switchView('my')">👤 내가 올린 사진</button>
      <button class="btn btn-tab" id="tab-team" onclick="switchView('team')">👥 팀 활동 내역 보기</button>
    </div>

    <div id="my-uploads">
      <div style="text-align:center; padding:24px; color:#78909C;">데이터를 로딩 중입니다...</div>
    </div>
  </div>
</div>

<!-- Firebase compat SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCdx4xwK3XIzgw_4hFEohnMe64dc4LDB00",
    authDomain: "elemeelementary-textbook.firebaseapp.com",
    projectId: "elemeelementary-textbook",
    storageBucket: "elemeelementary-textbook.firebasestorage.app",
    messagingSenderId: "713149004420",
    appId: "1:713149004420:web:8483273681e16f5a8fa0d1"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.firestore();

  const CLOUDINARY_NAME   = 'dbthgzdfu';
  const CLOUDINARY_PRESET = 'vxhz699w';
  const TARGET_SIZE = 600;
  const QUALITY     = 0.75;
  const PARALLEL    = 5;

  const studentId = localStorage.getItem("elementary_studentId");
  const studentName = localStorage.getItem("elementary_studentName") || "학생 탐정";

  if (!studentId) {
    window.location.href = "index.html";
  }

  let pendingFiles = [];
  let currentMode = 'my'; // 'my' or 'team'

  // 초기 로그인 유저 정보 및 점수 로드
  async function initUser() {
    try {
      const docSnap = await db.collection('students').doc(studentId).get();
      if (docSnap.exists) {
        const d = docSnap.data();
        document.getElementById('dispScore').textContent = `⭐ ${d.score || 0}점`;
        if (d.teamCode) {
          localStorage.setItem('elementary_teamCode', d.teamCode);
        }
      } else {
        const score = localStorage.getItem("elementary_score") || "0";
        document.getElementById('dispScore').textContent = `⭐ ${score}점`;
      }
    } catch(e) {
      console.error(e);
    }
    loadCurrentView();
  }

  function switchView(mode) {
    currentMode = mode;
    document.getElementById('tab-my').classList.toggle('active', mode === 'my');
    document.getElementById('tab-team').classList.toggle('active', mode === 'team');
    loadCurrentView();
  }

  function loadCurrentView() {
    if (currentMode === 'team') {
      loadTeamUploads();
    } else {
      loadMyUploads();
    }
  }

  // 600×600 리사이징 -> Blob
  function resizeToBlob(file) {
    return new Promise(resolve => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = c.height = TARGET_SIZE;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, TARGET_SIZE, TARGET_SIZE);
        const s = Math.min(TARGET_SIZE / img.width, TARGET_SIZE / img.height);
        const dw = img.width * s, dh = img.height * s;
        ctx.drawImage(img, (TARGET_SIZE - dw)/2, (TARGET_SIZE - dh)/2, dw, dh);
        URL.revokeObjectURL(url);
        c.toBlob(blob => resolve(blob), 'image/jpeg', QUALITY);
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
      img.src = url;
    });
  }

  // Cloudinary 업로드
  async function uploadToCloudinary(blob, fileName) {
    const form = new FormData();
    form.append('file', blob, fileName);
    form.append('upload_preset', CLOUDINARY_PRESET);
    form.append('folder', `elementary-textbook/${studentId}`);
    const res = await fetch(
      `https://api.cloudinary.com/v1_1/${CLOUDINARY_NAME}/image/upload`,
      { method: 'POST', body: form }
    );
    if (!res.ok) throw new Error('Cloudinary 업로드 실패: ' + res.status);
    return await res.json();
  }

  // 드래그 앤 드롭
  function dragOver(e) { e.preventDefault(); document.getElementById('upload-zone').classList.add('dragover'); }
  function dragLeave(e) { document.getElementById('upload-zone').classList.remove('dragover'); }
  function dropFiles(e) {
    e.preventDefault();
    document.getElementById('upload-zone').classList.remove('dragover');
    handleFiles(e.dataTransfer.files);
  }

  function handleFiles(files) {
    const arr = Array.from(files).filter(f => f.type.startsWith('image/'));
    if (!arr.length) { showAlert('이미지 파일만 선택 가능합니다.', 'error'); return; }
    if (pendingFiles.length + arr.length > 20) { showAlert('한 번에 최대 20장까지 올려주세요.', 'error'); return; }
    
    arr.forEach(file => {
      const id = 'f' + Date.now() + Math.random().toString(36).slice(2);
      pendingFiles.push({ id, file, status: 'pending', blob: null });
    });
    renderPreview();
    document.getElementById('pending-card').style.display = 'block';

    pendingFiles.filter(f => !f.blob && f.status === 'pending').forEach(async pf => {
      pf.blob = await resizeToBlob(pf.file);
    });
  }

  function renderPreview() {
    document.getElementById('pending-count').textContent = pendingFiles.length;
    document.getElementById('preview-grid').innerHTML = pendingFiles.map(pf => {
      const url = URL.createObjectURL(pf.file);
      const sc = pf.status === 'done' ? 'status-done' : pf.status === 'error' ? 'status-error' : 'status-pending';
      const st = pf.status === 'done' ? '✅ 완료' : pf.status === 'error' ? '❌ 오류' : '⏳ 대기';
      return `<div class="preview-item">
        <img src="${url}">
        ${pf.status === 'pending' ? `<button class="remove-btn" onclick="removeFile('${pf.id}')">✕</button>` : ''}
        <div class="status-badge ${sc}" id="badge-${pf.id}">${st}</div>
      </div>`;
    }).join('');
  }

  function removeFile(id) {
    pendingFiles = pendingFiles.filter(f => f.id !== id);
    if (!pendingFiles.length) document.getElementById('pending-card').style.display = 'none';
    else renderPreview();
  }

  function clearPending() {
    pendingFiles = [];
    document.getElementById('pending-card').style.display = 'none';
  }

  async function uploadAll() {
    const toUpload = pendingFiles.filter(f => f.status === 'pending');
    if (!toUpload.length) return;

    const btn = document.getElementById('upload-btn');
    btn.disabled = true;
    document.getElementById('progress-wrap').style.display = 'block';

    let done = 0; const total = toUpload.length;
    const teamCode = localStorage.getItem('elementary_teamCode') || '';

    const updateStatus = () => {
      document.getElementById('progress-bar').style.width = (done / total * 100) + '%';
      document.getElementById('upload-status').textContent =
        `☁️ 사진 변환 및 업로드 중... ${done}/${total}장 (${Math.round(done/total*100)}%)`;
    };
    updateStatus();

    for (let i = 0; i < toUpload.length; i += PARALLEL) {
      const chunk = toUpload.slice(i, i + PARALLEL);
      await Promise.all(chunk.map(async pf => {
        try {
          const badge = document.getElementById('badge-' + pf.id);
          if (badge) { badge.className = 'status-badge status-pending'; badge.textContent = '⚙️ 변환중'; }
          const blob = pf.blob || await resizeToBlob(pf.file);
          if (!blob) throw new Error('변환 실패');
          if (badge) { badge.textContent = '☁️ 업로드'; }
          const fileName = `${Date.now()}_${pf.file.name.replace(/\s/g, '_')}`;
          const result = await uploadToCloudinary(blob, fileName);

          await db.collection('uploads').add({
            userId: studentId,
            userName: studentName,
            fileName: result.public_id,
            originalName: pf.file.name,
            url: result.secure_url,
            cloudinaryId: result.public_id,
            labeled: false,
            width: TARGET_SIZE,
            height: TARGET_SIZE,
            created_at: new Date().toISOString(),
            teamCode: teamCode
          });

          pf.status = 'done';
          if (badge) { badge.className = 'status-badge status-done'; badge.textContent = '✅ 완료'; }
        } catch (e) {
          pf.status = 'error';
          const badge = document.getElementById('badge-' + pf.id);
          if (badge) { badge.className = 'status-badge status-error'; badge.textContent = '❌ 오류'; }
          console.error(e);
        }
        done++;
        updateStatus();
      }));
    }

    document.getElementById('upload-status').textContent = `✅ ${done}장 업로드 완료!`;
    document.getElementById('progress-bar').style.width = '100%';
    btn.disabled = false;
    loadCurrentView();

    // 점수 보상 (+20점)
    try {
      const userRef = db.collection('students').doc(studentId);
      const userDoc = await userRef.get();
      const currentScore = userDoc.exists ? (userDoc.data().score || 0) : 0;
      const questsDone = userDoc.exists ? (userDoc.data().questsDone || 0) : 0;

      await userRef.set({
        score: currentScore + 20,
        questsDone: Math.max(questsDone, 3),
        q3_done: true
      }, { merge: true });

      const newScore = currentScore + 20;
      localStorage.setItem("elementary_score", newScore);
      document.getElementById('dispScore').textContent = `⭐ ${newScore}점`;
      showAlert('🎉 퀘스트 3 완료! +20점 획득!', 'success');
    } catch(e) {
      console.error(e);
    }
  }

  // 내가 올린 사진 목록
  async function loadMyUploads() {
    try {
      const snap = await db.collection('uploads')
        .where('userId', '==', studentId)
        .get();

      document.getElementById('my-count').textContent = snap.size;
      if (snap.empty) {
        document.getElementById('my-uploads').innerHTML =
          `<div style="text-align:center; padding:24px; color:#78909C; font-weight:600;">아직 수집한 사진이 없습니다. 상단에서 사진을 올려보세요! 📸</div>`;
        return;
      }

      // 클라이언트 사이드 날짜 내림차순 정렬 (복합 색인 오류 방지)
      const docs = snap.docs.sort((a, b) => {
        const da = a.data().created_at || '';
        const db = b.data().created_at || '';
        return db.localeCompare(da);
      });

      document.getElementById('my-uploads').innerHTML = docs.map(doc => {
        const d = doc.data();
        const date = d.created_at ? d.created_at.slice(0, 16).replace('T', ' ') : '';
        return `<div class="uploaded-item">
          <img class="uploaded-thumb" src="${d.url}" onerror="this.style.opacity='0.3'">
          <div style="flex:1; min-width:80px; overflow:hidden;">
            <div style="font-size:16px; font-weight:bold; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${d.originalName || '사진 데이터'}</div>
            <div style="font-size:13px; color:#666;">규격: ${d.width || 600}×${d.height || 600}px</div>
          </div>
          <div style="font-size:14px; font-weight:bold; padding:6px 12px; border-radius:10px; flex-shrink:0;
            ${d.labeled ? 'background:#E8F5E9; color:#2E7D32;' : 'background:#FFF8E1; color:#F57F17;'}">
            ${d.labeled ? '✅ 라벨링 완료' : '⏳ 미완료'}
          </div>
          <div style="font-size:13px; color:#999; flex-shrink:0;">${date}</div>
          <button class="del-btn" onclick="deleteUpload('${doc.id}')">🗑️ 삭제</button>
        </div>`;
      }).join('');

    } catch (e) {
      document.getElementById('my-uploads').innerHTML =
        `<div style="color:#C62828; padding:16px; font-weight:bold;">로딩 오류: ${e.message}</div>`;
    }
  }

  // 팀 활동 내역 조회
  async function loadTeamUploads() {
    const teamCode = localStorage.getItem('elementary_teamCode');
    if (!teamCode) {
      document.getElementById('my-uploads').innerHTML =
        `<div style="text-align:center; padding:24px; color:#E65100; font-weight:bold;">
          ⚠️ 아직 팀 코드가 등록되지 않았습니다.<br>
          <a href="main.html" style="color:#0277BD; text-decoration:underline;">메인 화면으로 가서 팀 코드를 입력</a>해주세요!
        </div>`;
      document.getElementById('my-count').textContent = '0';
      return;
    }

    try {
      const snap = await db.collection('uploads')
        .where('teamCode', '==', teamCode)
        .get();

      document.getElementById('my-count').textContent = snap.size;
      if (snap.empty) {
        document.getElementById('my-uploads').innerHTML =
          `<div style="text-align:center; padding:24px; color:#78909C; font-weight:600;">
            👥 우리 모둠('${teamCode}') 친구들이 아직 등록한 사진이 없습니다.<br>친구들과 함께 사진을 올려보세요!
          </div>`;
        return;
      }

      // 날짜 내림차순 정렬
      const docs = snap.docs.sort((a, b) => {
        const da = a.data().created_at || '';
        const db = b.data().created_at || '';
        return db.localeCompare(da);
      });

      document.getElementById('my-uploads').innerHTML = docs.map(doc => {
        const d = doc.data();
        const date = d.created_at ? d.created_at.slice(0, 16).replace('T', ' ') : '';
        const isMine = d.userId === studentId;
        const uploaderLabel = isMine ? '나' : (d.userName || '모둠원');
        return `<div class="uploaded-item" style="${isMine ? 'border-color:#81C784;' : 'border-color:#90CAF9; background:#F0F8FF;'}">
          <img class="uploaded-thumb" src="${d.url}" onerror="this.style.opacity='0.3'">
          <div style="flex:1; min-width:80px; overflow:hidden;">
            <div style="font-size:16px; font-weight:bold; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
              ${d.originalName || '사진 데이터'}
            </div>
            <div style="font-size:13px; color:#546E7A; font-weight:600;">
              👤 올린이: <strong style="color:${isMine ? '#2E7D32' : '#0277BD'}">${uploaderLabel}</strong> (${d.width || 600}×${d.height || 600}px)
            </div>
          </div>
          <div style="font-size:14px; font-weight:bold; padding:6px 12px; border-radius:10px; flex-shrink:0;
            ${d.labeled ? 'background:#E8F5E9; color:#2E7D32;' : 'background:#FFF8E1; color:#F57F17;'}">
            ${d.labeled ? '✅ 라벨링 완료' : '⏳ 미완료'}
          </div>
          <div style="font-size:13px; color:#999; flex-shrink:0;">${date}</div>
          ${isMine ? `<button class="del-btn" onclick="deleteUpload('${doc.id}')">🗑️ 삭제</button>` : ''}
        </div>`;
      }).join('');

    } catch (e) {
      document.getElementById('my-uploads').innerHTML =
        `<div style="color:#C62828; padding:16px; font-weight:bold;">로딩 오류: ${e.message}</div>`;
    }
  }

  async function deleteUpload(docId) {
    if (!confirm('이 사진을 정말 삭제할까요?')) return;
    try {
      await db.collection('uploads').doc(docId).delete();
      loadCurrentView();
    } catch(e) {
      alert('삭제 실패: ' + e.message);
    }
  }

  function showAlert(msg, type = 'success') {
    const c = { success: 'alert-success', error: 'alert-error' };
    document.getElementById('main-alert').innerHTML = `<div class="alert ${c[type] || ''}">${msg}</div>`;
    setTimeout(() => {
      const el = document.getElementById('main-alert');
      if (el) el.innerHTML = '';
    }, 5000);
  }

  initUser();
</script>
</body>
</html>
