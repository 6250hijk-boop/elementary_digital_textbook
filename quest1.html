<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quest 1 - AI의 시선</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    body { background-color: #F0F4F8; padding: 20px; color: #2C3E50; }
    .card { max-width: 680px; margin: 0 auto; background: white; border-radius: 20px; padding: 25px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    h2 { color: #1976D2; margin-bottom: 12px; }
    .guide-box { background: #E3F2FD; border-left: 5px solid #1976D2; padding: 12px; border-radius: 8px; margin-bottom: 18px; font-size: 14px; line-height: 1.5; }
    select, textarea { width: 100%; padding: 12px; border: 2px solid #E0E0E0; border-radius: 10px; font-size: 14px; margin-bottom: 12px; outline: none; }
    select:focus, textarea:focus { border-color: #1976D2; }
    .btn-submit { width: 100%; padding: 14px; background: #1976D2; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .btn-submit:hover { background: #1565C0; }
    .feed-title { margin-top: 25px; font-size: 15px; font-weight: bold; color: #333; }
    .feed-item { background: #F8F9FA; border-left: 4px solid #1976D2; padding: 10px 14px; border-radius: 8px; margin-top: 8px; font-size: 13px; }
  </style>
</head>
<body>

<div class="card">
  <a href="main.html" style="text-decoration: none; color: #666; font-size: 13px; font-weight: bold;">⬅️ 마을로 돌아가기</a>
  <h2 style="margin-top: 8px;">🔍 [Quest 1] AI 시선과 학교 자원순환 문제</h2>
  <div class="guide-box">AI는 사진을 픽셀(숫자) 데이터로 읽습니다. 우리 학교 쓰레기 분리배출 문제를 찾고 AI에게 필요한 데이터를 제안하세요.</div>

  <label style="font-weight: bold; font-size: 13px; display: block; margin-bottom: 4px;">1. 우리 학교 분리수거장에서 가장 자주 발생하는 문제는?</label>
  <select id="problem">
    <option value="음식물 오염">음식물이 묻은 채로 버려짐</option>
    <option value="라벨 미제거">페트병 비닐 라벨을 안 떼고 버림</option>
    <option value="우유팩 혼합">우유팩을 일반 종이에 섞어 버림</option>
    <option value="일반쓰레기 혼합">일반쓰레기와 재활용품이 섞여 있음</option>
  </select>

  <label style="font-weight: bold; font-size: 13px; display: block; margin-bottom: 4px;">2. AI가 이 문제를 스스로 판별하려면 어떤 사진 데이터를 학습시켜야 할까요?</label>
  <textarea id="dataIdea" rows="3" placeholder="예: 깨끗한 페트병과 라벨이 붙은 페트병 사진을 각각 100장씩 학습시켜요."></textarea>
  <button class="btn-submit" id="saveBtn">의견 등록하고 점수 받기 (⭐ +20점)</button>

  <div class="feed-title">📡 실시간 등록된 학급 친구들의 데이터 아이디어</div>
  <div id="liveFeed" style="margin-top: 6px;">불러오는 중...</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, setDoc, increment, collection, addDoc, onSnapshot, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCdx4xwK3XIzgw_4hFEohnMe64dc4LDB00",
    authDomain: "elemeelementary-textbook.firebaseapp.com",
    projectId: "elemeelementary-textbook",
    storageBucket: "elemeelementary-textbook.firebasestorage.app",
    messagingSenderId: "713149004420",
    appId: "1:713149004420:web:8483273681e16f5a8fa0d1",
    measurementId: "G-TZT282J9E8"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const studentId = localStorage.getItem("elementary_studentId") || "Guest_" + Math.floor(Math.random() * 1000);
  const studentName = localStorage.getItem("elementary_studentName") || "체험탐정";

  // 실시간 피드 구독
  const feedQ = query(collection(db, "quest1_feed"), orderBy("createdAt", "desc"), limit(5));
  onSnapshot(feedQ, (snapshot) => {
    const box = document.getElementById("liveFeed");
    box.innerHTML = "";
    if (snapshot.empty) {
      box.innerHTML = "<div style='color:#888; font-size:13px;'>아직 등록된 의견이 없습니다. 첫 번째 의견을 작성해보세요!</div>";
      return;
    }
    snapshot.forEach(docSnap => {
      const d = docSnap.data();
      const div = document.createElement("div");
      div.className = "feed-item";
      div.innerHTML = `<strong>${d.studentName}</strong>: [${d.problem}] ${d.dataIdea}`;
      box.appendChild(div);
    });
  }, (err) => {
    console.error("피드 로딩 오류:", err);
  });

  // 데이터 저장 이벤트
  document.getElementById("saveBtn").addEventListener("click", async () => {
    const prob = document.getElementById("problem").value;
    const idea = document.getElementById("dataIdea").value.trim();
    const btn = document.getElementById("saveBtn");

    if (!idea) {
      alert("AI에게 필요한 데이터 학습 아이디어를 적어주세요!");
      return;
    }

    btn.disabled = true;
    btn.textContent = "저장 중...";

    try {
      // 1. 피드 컬렉션에 기록 추가
      await addDoc(collection(db, "quest1_feed"), {
        studentId: studentId,
        studentName: studentName,
        problem: prob,
        dataIdea: idea,
        createdAt: serverTimestamp()
      });

      // 2. 학생 점수 문서 생성 또는 업데이트 (setDoc merge)
      await setDoc(doc(db, "students", studentId), {
        studentId: studentId,
        studentName: studentName,
        score: increment(20),
        lastActive: serverTimestamp()
      }, { merge: true });

      // 로컬 스토리지 점수 갱신
      let currentScore = parseInt(localStorage.getItem("elementary_score") || "10", 10) + 20;
      localStorage.setItem("elementary_score", currentScore.toString());

      alert("🎉 Quest 1 완료! (⭐ +20점)");
      window.location.href = "main.html";
    } catch (e) {
      console.error("상세 저장 에러:", e);
      alert("저장 실패: " + e.message);
      btn.disabled = false;
      btn.textContent = "의견 등록하고 점수 받기 (⭐ +20점)";
    }
  });
</script>
</body>
</html>
