<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 자원순환 탐정단 - 모둠 로그인</title>
  <!-- 저작권 무료 폰트: Pretendard 및 Google Fonts Jua 사용 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #2E7D32;
      --primary-dark: #1B5E20;
      --accent-color: #FFB300;
      --bg-color: #E8F5E9;
      --card-bg: #FFFFFF;
      --text-main: #1B5E20;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background: linear-gradient(135deg, #E8F5E9, #C8E6C9);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .login-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 500px;
      padding: 38px 28px;
      border-radius: 28px;
      box-shadow: 0 16px 36px rgba(46, 125, 50, 0.15);
      text-align: center;
      border: 3px solid #A5D6A7;
    }

    .badge-icon {
      font-size: 58px;
      margin-bottom: 8px;
      animation: bounce 2s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h1 {
      font-family: 'Jua', sans-serif;
      font-size: 32px;
      color: var(--primary-color);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    p.sub {
      font-size: 15px;
      font-weight: 600;
      color: #558B2F;
      margin-bottom: 24px;
      background: #F1F8E9;
      padding: 8px 18px;
      border-radius: 20px;
      display: inline-block;
    }

    .info-banner {
      background: #E8F5E9;
      border: 2px dashed #81C784;
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 22px;
      font-size: 14px;
      color: #2E7D32;
      line-height: 1.5;
      text-align: left;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .info-banner .icon {
      font-size: 24px;
      flex-shrink: 0;
    }

    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Jua', sans-serif;
      font-size: 18px;
      color: #2E7D32;
      margin-bottom: 6px;
    }

    .label-hint {
      font-family: 'Pretendard', sans-serif;
      font-size: 12px;
      color: #7CB342;
      font-weight: 600;
    }

    input[type="text"] {
      width: 100%;
      padding: 16px 18px;
      border: 3px solid #C8E6C9;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 600;
      color: #1B5E20;
      outline: none;
      transition: all 0.2s;
      background: #FAFAFA;
    }

    input[type="text"]:focus {
      border-color: var(--primary-color);
      background: #FFFFFF;
      box-shadow: 0 0 0 4px rgba(46, 125, 50, 0.15);
    }

    .btn-start {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #4CAF50, #2E7D32);
      color: white;
      border: none;
      border-radius: 18px;
      font-family: 'Jua', sans-serif;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(46, 125, 50, 0.3);
      transition: all 0.2s;
      margin-top: 6px;
    }

    .btn-start:active {
      transform: translateY(2px);
      box-shadow: 0 2px 8px rgba(46, 125, 50, 0.3);
    }

    .admin-hint {
      margin-top: 20px;
      font-size: 13px;
      color: #607D8B;
      background: #F5F5F5;
      padding: 10px 14px;
      border-radius: 14px;
      display: inline-block;
      border: 1px solid #ECEFF1;
    }

    .admin-hint b {
      color: #D32F2F;
    }

    @media (max-width: 480px) {
      .login-card { padding: 24px 18px; }
      h1 { font-size: 26px; }
      label { font-size: 16px; }
      input[type="text"] { font-size: 16px; padding: 14px; }
      .btn-start { font-size: 19px; padding: 16px; }
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="badge-icon">🌱🕵️‍♂️</div>
  <h1>AI 자원순환 탐정단</h1>
  <p class="sub">초등 5학년 실시간 모둠 협동 교과서</p>

  <div class="info-banner">
    <div class="icon">💡</div>
    <div>
      <strong>아이디와 비밀번호 없이 모둠 코드로 입장!</strong><br>
      선생님이 알려주신 모둠 코드를 입력하면 친구들과 같은 대기방으로 입장합니다.
    </div>
  </div>

  <!-- 모둠 코드 & 학생 이름 입력 -->
  <div class="form-group">
    <label for="teamCodeInput">
      🏷️ 모둠 코드 (팀 코드)
      <span class="label-hint">선생님이 알려주신 코드</span>
    </label>
    <input type="text" id="teamCodeInput" placeholder="예: 1모둠, GREEN, DREAM 등" autocomplete="off" autofocus>
  </div>

  <div class="form-group">
    <label for="studentNameInput">
      👤 내 이름 (학생 닉네임)
      <span class="label-hint">대기방 출석 닉네임</span>
    </label>
    <input type="text" id="studentNameInput" placeholder="예: 김민수, 이지은" autocomplete="off">
  </div>

  <button class="btn-start" id="loginBtn">🚀 모둠 대기방 입장하기</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, arrayUnion, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCdx4xwK3XIzgw_4hFEohnMe64dc4LDB00",
    authDomain: "elemeelementary-textbook.firebaseapp.com",
    projectId: "elemeelementary-textbook",
    storageBucket: "elemeelementary-textbook.firebasestorage.app",
    messagingSenderId: "713149004420",
    appId: "1:713149004420:web:8483273681e16f5a8fa0d1",
    measurementId: "G-TZT282J9E8"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const teamInput = document.getElementById("teamCodeInput");
  const studentInput = document.getElementById("studentNameInput");
  const loginBtn = document.getElementById("loginBtn");

  // 이전 저장된 기록 불러오기 (편의성)
  const savedTeam = localStorage.getItem("elementary_teamCode") || "";
  const savedStudent = localStorage.getItem("elementary_studentName") || "";

  if (savedTeam && savedTeam !== "admin") teamInput.value = savedTeam;
  if (savedStudent && savedStudent !== "선생님(관리자)") studentInput.value = savedStudent;

  // 엔터 키 지원
  [teamInput, studentInput].forEach(inp => {
    inp.addEventListener("keypress", (e) => {
      if (e.key === "Enter") loginBtn.click();
    });
  });

  // 입장하기 버튼 클릭 이벤트
  loginBtn.addEventListener("click", async () => {
    const rawTeamCode = teamInput.value.trim();
    const studentName = studentInput.value.trim();

    if (!rawTeamCode) {
      return alert("🏷️ 모둠 코드를 입력해주세요!");
    }

    // 👑 관리자 모드 접속 분기 (admin)
    if (rawTeamCode.toLowerCase() === "admin") {
      localStorage.setItem("elementary_isAdmin", "true");
      localStorage.setItem("elementary_studentId", "admin");
      localStorage.setItem("elementary_studentName", "선생님(관리자)");
      localStorage.setItem("elementary_teamCode", "admin");
      alert("👑 관리자 모드로 접속합니다!\n관리자 페이지로 이동합니다.");
      window.location.href = "admin.html";
      return;
    }

    if (!studentName) {
      return alert("👤 내 이름(학생 닉네임)을 입력해주세요!");
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "🔍 모둠 코드 확인 중...";

    try {
      const teamCode = rawTeamCode;
      const studentId = `${teamCode}_${studentName}`;

      // 1. 교사가 생성한 모둠(Team) 존재 여부 검증 (단, test 코드는 테스트용으로 항시 허용)
      const isTestCode = (rawTeamCode.toLowerCase() === "test");
      const teamRef = doc(db, "teams", teamCode);
      const teamSnap = await getDoc(teamRef);

      if (!teamSnap.exists() && !isTestCode) {
        alert(`⚠️ '${teamCode}'(은)는 선생님이 개설하지 않은 모둠 코드입니다!\n선생님이 만드신 올바른 모둠 코드를 입력해주세요. (테스트용: test)`);
        loginBtn.disabled = false;
        loginBtn.textContent = "🚀 모둠 대기방 입장하기";
        return;
      }

      // test 모둠이 데이터베이스에 아직 없는 경우 기본 데이터 자동 생성
      if (!teamSnap.exists() && isTestCode) {
        await setDoc(teamRef, {
          teamCode: "test",
          aiName: "테스트봇",
          score: 10,
          badge: "신입 탐정단",
          approvedQuests: {},
          createdAt: serverTimestamp()
        }, { merge: true });
      }

      const ex = teamSnap.data();
      const teamScore = ex.score !== undefined ? ex.score : 10;
      const questsDone = ex.questsDone !== undefined ? ex.questsDone : 0;
      const badge = ex.badge || "신입 탐정단";
      const aiName = ex.aiName || "에코봇";

      // 팀원 목록에 학생 추가
      await setDoc(teamRef, {
        teamCode: teamCode,
        members: arrayUnion(studentName),
        lastActive: serverTimestamp()
      }, { merge: true });

      // 2. 학생(Student) 개별 데이터 기록
      const studentRef = doc(db, "students", studentId);
      await setDoc(studentRef, {
        studentId: studentId,
        studentName: studentName,
        teamCode: teamCode,
        aiPartnerName: aiName,
        score: teamScore,
        badge: badge,
        questsDone: questsDone,
        lastActive: serverTimestamp()
      }, { merge: true });

      // 3. 로컬 스토리지에 모둠 및 학생 세션 저장
      localStorage.setItem("elementary_teamCode", teamCode);
      localStorage.setItem("elementary_studentId", studentId);
      localStorage.setItem("elementary_studentName", studentName);
      localStorage.setItem("elementary_aiName", aiName);
      localStorage.setItem("elementary_score", teamScore.toString());
      localStorage.removeItem("elementary_isAdmin");

      window.location.href = "main.html";

    } catch (e) {
      console.error(e);
      alert("대기방 입장 중 오류가 발생했습니다: " + e.message);
      loginBtn.disabled = false;
      loginBtn.textContent = "🚀 모둠 대기방 입장하기";
    }
  });
</script>
</body>
</html>
