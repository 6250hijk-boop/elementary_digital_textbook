<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 자원순환 탐정단 - 입장</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    body {
      background: linear-gradient(135deg, #E8F5E9, #C8E6C9);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .login-card {
      background: #FFFFFF;
      width: 100%;
      max-width: 480px;
      padding: 35px 30px;
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    .badge-icon { font-size: 50px; margin-bottom: 8px; }
    h1 { font-size: 22px; color: #2E7D32; margin-bottom: 6px; }
    p.sub { font-size: 14px; color: #666; margin-bottom: 22px; }
    
    .form-group { text-align: left; margin-bottom: 14px; }
    label { display: block; font-weight: bold; font-size: 13px; color: #333; margin-bottom: 5px; }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #E0E0E0;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #4CAF50; }
    
    .btn-start {
      width: 100%;
      padding: 14px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      transition: background-color 0.2s;
    }
    .btn-start:hover { background-color: #388E3C; }

    .btn-guest {
      width: 100%;
      padding: 12px;
      background-color: #ECEFF1;
      color: #455A64;
      border: 1px solid #CFD8DC;
      border-radius: 12px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      transition: background-color 0.2s;
    }
    .btn-guest:hover { background-color: #CFD8DC; }
    
    .resume-box {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px dashed #DDD;
      font-size: 13px;
      color: #777;
    }
    .btn-resume {
      background: none;
      border: none;
      color: #2E7D32;
      font-weight: bold;
      cursor: pointer;
      text-decoration: underline;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="badge-icon">🌱🕵️‍♂️</div>
  <h1>AI 자원순환 탐정단</h1>
  <p class="sub">초등 4~5학년을 위한 AI 디지털 교과서</p>

  <div class="form-group">
    <label for="studentId">학번 (학년·반·번호)</label>
    <input type="text" id="studentId" placeholder="예: 40105 (4학년 1반 5번)">
  </div>

  <div class="form-group">
    <label for="studentName">학생 이름</label>
    <input type="text" id="studentName" placeholder="예: 홍길동">
  </div>

  <div class="form-group">
    <label for="aiName">함께할 AI 로봇 파트너 이름</label>
    <input type="text" id="aiName" placeholder="예: 에코봇, 순환이">
  </div>

  <button class="btn-start" id="startBtn">탐정단 정식 입장하기 🚀</button>
  <button class="btn-guest" id="guestBtn">체험용 임시 로그인 ⚡</button>

  <div class="resume-box" id="resumeArea" style="display: none;">
    <span>이전에 진행하던 기록이 있습니다.</span><br>
    <button class="btn-resume" id="resumeBtn">이전 활동 바로 이어하기</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCdx4xwK3XIzgw_4hFEohnMe64dc4LDB00",
    authDomain: "elemeelementary-textbook.firebaseapp.com",
    projectId: "elemeelementary-textbook",
    storageBucket: "elemeelementary-textbook.firebasestorage.app",
    messagingSenderId: "713149004420",
    appId: "1:713149004420:web:8483273681e16f5a8fa0d1",
    measurementId: "G-TZT282J9E8"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const idInput = document.getElementById("studentId");
  const nameInput = document.getElementById("studentName");
  const aiInput = document.getElementById("aiName");
  const startBtn = document.getElementById("startBtn");
  const guestBtn = document.getElementById("guestBtn");
  const resumeArea = document.getElementById("resumeArea");
  const resumeBtn = document.getElementById("resumeBtn");

  // 이전 세션 확인
  const savedId = localStorage.getItem("elementary_studentId");
  const savedName = localStorage.getItem("elementary_studentName");

  if (savedId && savedName) {
    resumeArea.style.display = "block";
    resumeBtn.addEventListener("click", () => {
      window.location.href = "main.html";
    });
  }

  // 1. 정식 로그인 (Firebase 기록 + 세션 저장)
  startBtn.addEventListener("click", async () => {
    const sId = idInput.value.trim();
    const sName = nameInput.value.trim();
    const aiName = aiInput.value.trim();

    if (!sId || !sName || !aiName) {
      alert("학번, 이름, AI 파트너 이름을 모두 입력해주세요!");
      return;
    }

    startBtn.disabled = true;
    startBtn.textContent = "입장 등록 중...";

    try {
      await addDoc(collection(db, "students"), {
        studentId: sId,
        studentName: sName,
        aiPartnerName: aiName,
        isGuest: false,
        createdAt: serverTimestamp()
      });

      localStorage.setItem("elementary_studentId", sId);
      localStorage.setItem("elementary_studentName", sName);
      localStorage.setItem("elementary_aiName", aiName);
      if (!localStorage.getItem("elementary_score")) {
        localStorage.setItem("elementary_score", "10");
      }

      window.location.href = "main.html";
    } catch (error) {
      console.error("Firestore 저장 오류:", error);
      alert("입장 중 오류가 발생했습니다.");
      startBtn.disabled = false;
      startBtn.textContent = "탐정단 정식 입장하기 🚀";
    }
  });

  // 2. 체험용 임시 로그인
  guestBtn.addEventListener("click", () => {
    localStorage.setItem("elementary_studentId", "Guest-01");
    localStorage.setItem("elementary_studentName", "체험탐정");
    localStorage.setItem("elementary_aiName", "테스트봇");
    localStorage.setItem("elementary_score", "10");
    alert("체험 계정으로 메인 화면에 진입합니다.");
    window.location.href = "main.html";
  });
</script>
</body>
</html>
