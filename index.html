<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 자원순환 탐정단 - 입장</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    body { background: linear-gradient(135deg, #E8F5E9, #C8E6C9); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .login-card { background: #FFFFFF; width: 100%; max-width: 480px; padding: 30px; border-radius: 24px; box-shadow: 0 12px 30px rgba(0,0,0,0.1); text-align: center; }
    .badge-icon { font-size: 45px; margin-bottom: 6px; }
    h1 { font-size: 22px; color: #2E7D32; margin-bottom: 4px; }
    p.sub { font-size: 13px; color: #666; margin-bottom: 20px; }
    .form-group { text-align: left; margin-bottom: 12px; }
    label { display: block; font-weight: bold; font-size: 13px; color: #333; margin-bottom: 4px; }
    input[type="text"] { width: 100%; padding: 12px; border: 2px solid #E0E0E0; border-radius: 12px; font-size: 14px; outline: none; }
    input[type="text"]:focus { border-color: #4CAF50; }
    .btn-start { width: 100%; padding: 14px; background-color: #4CAF50; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 6px; }
    .btn-start:hover { background-color: #388E3C; }
    .btn-guest { width: 100%; padding: 11px; background-color: #ECEFF1; color: #455A64; border: 1px solid #CFD8DC; border-radius: 12px; font-size: 13px; font-weight: bold; cursor: pointer; margin-top: 6px; }
  </style>
</head>
<body>

<div class="login-card">
  <div class="badge-icon">🌱🕵️‍♂️</div>
  <h1>AI 자원순환 탐정단</h1>
  <p class="sub">초등 4~5학년 실시간 AI 디지털 교과서</p>

  <div class="form-group">
    <label for="studentId">학번 (예: 40105)</label>
    <input type="text" id="studentId" placeholder="학년·반·번호 입력">
  </div>
  <div class="form-group">
    <label for="studentName">학생 이름</label>
    <input type="text" id="studentName" placeholder="이름 입력">
  </div>
  <div class="form-group">
    <label for="aiName">함께할 AI 로봇 이름</label>
    <input type="text" id="aiName" placeholder="예: 에코봇">
  </div>

  <button class="btn-start" id="startBtn">탐정단 등록 및 설문 시작 🚀</button>
  <button class="btn-guest" id="guestBtn">체험용 임시 입장 ⚡</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCdx4xwK3XIzgw_4hFEohnMe64dc4LDB00",
    authDomain: "elemeelementary-textbook.firebaseapp.com",
    projectId: "elemeelementary-textbook",
    storageBucket: "elemeelementary-textbook.firebasestorage.app",
    messagingSenderId: "713149004420",
    appId: "1:713149004420:web:8483273681e16f5a8fa0d1",
    measurementId: "G-TZT282J9E8"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  document.getElementById("startBtn").addEventListener("click", async () => {
    const sId = document.getElementById("studentId").value.trim();
    const sName = document.getElementById("studentName").value.trim();
    const ai = document.getElementById("aiName").value.trim();

    if (!sId || !sName || !ai) return alert("모든 항목을 입력해주세요!");

    await setDoc(doc(db, "students", sId), {
      studentId: sId,
      studentName: sName,
      aiPartnerName: ai,
      score: 10,
      badge: "신입 탐정",
      lastActive: serverTimestamp()
    }, { merge: true });

    localStorage.setItem("elementary_studentId", sId);
    localStorage.setItem("elementary_studentName", sName);
    localStorage.setItem("elementary_aiName", ai);
    
    // 사전 설문 화면으로 이동
    window.location.href = "survey.html";
  });

  document.getElementById("guestBtn").addEventListener("click", () => {
    const guestId = "Guest_" + Math.floor(Math.random() * 1000);
    localStorage.setItem("elementary_studentId", guestId);
    localStorage.setItem("elementary_studentName", "체험탐정");
    localStorage.setItem("elementary_aiName", "체험봇");
    
    // 사전 설문 화면으로 이동
    window.location.href = "survey.html";
  });
</script>
</body>
</html>
