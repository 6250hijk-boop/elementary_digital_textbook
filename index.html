<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 자원순환 탐정단 - 입장</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    body {
      background: linear-gradient(135deg, #E8F5E9, #C8E6C9);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .login-card {
      background: #FFFFFF;
      width: 100%;
      max-width: 480px;
      padding: 35px 30px;
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    .badge-icon { font-size: 55px; margin-bottom: 10px; }
    h1 { font-size: 24px; color: #2E7D32; margin-bottom: 8px; }
    p.sub { font-size: 14px; color: #666; margin-bottom: 25px; }
    
    .form-group { text-align: left; margin-bottom: 18px; }
    label { display: block; font-weight: bold; font-size: 14px; color: #333; margin-bottom: 6px; }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #E0E0E0;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #4CAF50; }
    
    .btn-start {
      width: 100%;
      padding: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn-start:hover { background-color: #388E3C; }
    .btn-start:active { transform: scale(0.98); }
    
    .resume-box {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px dashed #DDD;
      font-size: 13px;
      color: #777;
    }
    .btn-resume {
      background: none;
      border: none;
      color: #2E7D32;
      font-weight: bold;
      cursor: pointer;
      text-decoration: underline;
      margin-top: 6px;
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="badge-icon">🌱🕵️‍♂️</div>
  <h1>AI 자원순환 탐정단</h1>
  <p class="sub">초등 4~5학년을 위한 AI 디지털 교과서</p>

  <div class="form-group">
    <label for="groupCode">모둠 코드</label>
    <input type="text" id="groupCode" placeholder="예: 4학년1반3모둠">
  </div>

  <div class="form-group">
    <label for="aiName">함께할 AI 로봇 파트너 이름</label>
    <input type="text" id="aiName" placeholder="예: 에코봇, 분리순환이">
  </div>

  <button class="btn-start" id="startBtn">탐정단 시작하기 🚀</button>

  <div class="resume-box" id="resumeArea" style="display: none;">
    <span>이전에 진행하던 기록이 있습니다.</span><br>
    <button class="btn-resume" id="resumeBtn">이전 활동 바로 이어하기</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCdx4xwK3XIzgw_4hFEohnMe64dc4LDB00",
    authDomain: "elemeelementary-textbook.firebaseapp.com",
    projectId: "elemeelementary-textbook",
    storageBucket: "elemeelementary-textbook.firebasestorage.app",
    messagingSenderId: "713149004420",
    appId: "1:713149004420:web:8483273681e16f5a8fa0d1",
    measurementId: "G-TZT282J9E8"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const groupInput = document.getElementById("groupCode");
  const aiInput = document.getElementById("aiName");
  const startBtn = document.getElementById("startBtn");
  const resumeArea = document.getElementById("resumeArea");
  const resumeBtn = document.getElementById("resumeBtn");

  // 기존 세션 확인
  const savedGroup = localStorage.getItem("elementary_groupCode");
  const savedAi = localStorage.getItem("elementary_aiName");

  if (savedGroup && savedAi) {
    resumeArea.style.display = "block";
    resumeBtn.addEventListener("click", () => {
      window.location.href = "main.html";
    });
  }

  // 시작하기 버튼 클릭
  startBtn.addEventListener("click", async () => {
    const groupCode = groupInput.value.trim();
    const aiName = aiInput.value.trim();

    if (!groupCode || !aiName) {
      alert("모둠 코드와 AI 파트너 이름을 모두 입력해주세요!");
      return;
    }

    startBtn.disabled = true;
    startBtn.textContent = "입장 등록 중...";

    try {
      // 1. Firebase Firestore에 모둠 입장 기록 생성
      await addDoc(collection(db, "groups"), {
        groupCode: groupCode,
        aiPartnerName: aiName,
        createdAt: serverTimestamp()
      });

      // 2. 브라우저 로컬 저장소에 세션 저장
      localStorage.setItem("elementary_groupCode", groupCode);
      localStorage.setItem("elementary_aiName", aiName);
      if (!localStorage.getItem("elementary_score")) {
        localStorage.setItem("elementary_score", "10"); // 입장 점수
      }

      // 3. 메인 화면으로 이동
      window.location.href = "main.html";
    } catch (error) {
      console.error("Firestore 등록 실패:", error);
      alert("입장 중 오류가 발생했습니다. 다시 시도해주세요.");
      startBtn.disabled = false;
      startBtn.textContent = "탐정단 시작하기 🚀";
    }
  });
</script>
</body>
</html>
