<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 자원순환 탐정단 - 로그인 및 계정 생성</title>
  <!-- 저작권 무료 폰트: Pretendard 및 Google Fonts Jua 사용 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #2E7D32;
      --primary-dark: #1B5E20;
      --accent-color: #FFB300;
      --bg-color: #E8F5E9;
      --card-bg: #FFFFFF;
      --text-main: #1B5E20;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background: linear-gradient(135deg, #E8F5E9, #C8E6C9);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .login-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 520px;
      padding: 36px 28px;
      border-radius: 28px;
      box-shadow: 0 16px 36px rgba(46, 125, 50, 0.15);
      text-align: center;
      border: 3px solid #A5D6A7;
    }

    .badge-icon {
      font-size: 60px;
      margin-bottom: 6px;
      animation: bounce 2s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h1 {
      font-family: 'Jua', sans-serif;
      font-size: 32px;
      color: var(--primary-color);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    p.sub {
      font-size: 15px;
      font-weight: 600;
      color: #558B2F;
      margin-bottom: 20px;
      background: #F1F8E9;
      padding: 8px 16px;
      border-radius: 20px;
      display: inline-block;
    }

    /* 로그인 / 회원가입 탭 토글 */
    .tab-group {
      display: flex;
      background: #E8F5E9;
      border-radius: 18px;
      padding: 6px;
      margin-bottom: 22px;
      gap: 6px;
    }

    .tab-btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-family: 'Jua', sans-serif;
      font-size: 20px;
      color: #558B2F;
      background: transparent;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #FFFFFF;
      color: var(--primary-color);
      box-shadow: 0 4px 12px rgba(46, 125, 50, 0.15);
    }

    /* 폼 영역 */
    .form-content {
      display: none;
    }

    .form-content.active {
      display: block;
    }

    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-family: 'Jua', sans-serif;
      font-size: 18px;
      color: #2E7D32;
      margin-bottom: 6px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 16px 18px;
      border: 3px solid #C8E6C9;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 600;
      color: #1B5E20;
      outline: none;
      transition: all 0.2s;
      background: #FAFAFA;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      border-color: var(--primary-color);
      background: #FFFFFF;
      box-shadow: 0 0 0 4px rgba(46, 125, 50, 0.15);
    }

    .btn-start {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #4CAF50, #2E7D32);
      color: white;
      border: none;
      border-radius: 18px;
      font-family: 'Jua', sans-serif;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(46, 125, 50, 0.3);
      transition: all 0.2s;
      margin-top: 10px;
    }

    .btn-start:active {
      transform: translateY(2px);
      box-shadow: 0 2px 8px rgba(46, 125, 50, 0.3);
    }

    .admin-hint {
      margin-top: 18px;
      font-size: 13px;
      color: #78909C;
      background: #F5F5F5;
      padding: 8px 12px;
      border-radius: 12px;
      display: inline-block;
    }

    @media (max-width: 480px) {
      .login-card { padding: 24px 18px; }
      h1 { font-size: 26px; }
      .tab-btn { font-size: 17px; padding: 12px; }
      label { font-size: 16px; }
      input[type="text"], input[type="password"] { font-size: 16px; padding: 14px; }
      .btn-start { font-size: 19px; padding: 16px; }
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="badge-icon">🌱🕵️‍♂️</div>
  <h1>AI 자원순환 탐정단</h1>
  <p class="sub">초등 5학년 AI 디지털 교과서</p>

  <!-- 탭 선택: 로그인 vs 계정 생성 (회원가입) -->
  <div class="tab-group">
    <button class="tab-btn active" id="tabLoginBtn" onclick="switchForm('login')">🔑 로그인</button>
    <button class="tab-btn" id="tabSignupBtn" onclick="switchForm('signup')">✨ 계정 생성 (회원가입)</button>
  </div>

  <!-- 1. 로그인 폼 -->
  <div class="form-content active" id="loginFormArea">
    <div class="form-group">
      <label for="loginId">🆔 아이디</label>
      <input type="text" id="loginId" placeholder="아이디 입력">
    </div>
    <div class="form-group">
      <label for="loginPw">🔒 비밀번호</label>
      <input type="password" id="loginPw" placeholder="비밀번호 입력">
    </div>
    <button class="btn-start" id="loginSubmitBtn">🚀 로그인하고 입장하기</button>
  </div>

  <!-- 2. 계정 생성 (회원가입) 폼 -->
  <div class="form-content" id="signupFormArea">
    <div class="form-group">
      <label for="signupId">🆔 사용할 아이디</label>
      <input type="text" id="signupId" placeholder="아이디 (영문 또는 숫자)">
    </div>
    <div class="form-group">
      <label for="signupPw">🔒 비밀번호</label>
      <input type="password" id="signupPw" placeholder="비밀번호 입력">
    </div>
    <div class="form-group">
      <label for="signupPwConfirm">🔒 비밀번호 확인</label>
      <input type="password" id="signupPwConfirm" placeholder="비밀번호 다시 입력">
    </div>
    <div class="form-group">
      <label for="signupNickname">👤 닉네임 (학생 이름)</label>
      <input type="text" id="signupNickname" placeholder="예: 탐정홍길동">
    </div>
    <div class="form-group">
      <label for="signupAiName">🤖 나만의 AI 파트너 이름</label>
      <input type="text" id="signupAiName" placeholder="예: 에코봇">
    </div>
    <button class="btn-start" id="signupSubmitBtn">🎉 계정 생성 및 바로 입장</button>
  </div>

  <div class="admin-hint">
    👑 관리자 접속: 아이디 <b>admin</b> / 비밀번호 <b>admin</b>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCdx4xwK3XIzgw_4hFEohnMe64dc4LDB00",
    authDomain: "elemeelementary-textbook.firebaseapp.com",
    projectId: "elemeelementary-textbook",
    storageBucket: "elemeelementary-textbook.firebasestorage.app",
    messagingSenderId: "713149004420",
    appId: "1:713149004420:web:8483273681e16f5a8fa0d1",
    measurementId: "G-TZT282J9E8"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // 탭 전환 헬퍼
  window.switchForm = function(type) {
    const loginForm = document.getElementById("loginFormArea");
    const signupForm = document.getElementById("signupFormArea");
    const tabLogin = document.getElementById("tabLoginBtn");
    const tabSignup = document.getElementById("tabSignupBtn");

    if (type === 'login') {
      loginForm.classList.add("active");
      signupForm.classList.remove("active");
      tabLogin.classList.add("active");
      tabSignup.classList.remove("active");
    } else {
      loginForm.classList.remove("active");
      signupForm.classList.add("active");
      tabLogin.classList.remove("active");
      tabSignup.classList.add("active");
    }
  };

  // 1. 로그인 처리 (admin/admin 시 관리자 페이지로 이동)
  document.getElementById("loginSubmitBtn").addEventListener("click", async () => {
    const uId = document.getElementById("loginId").value.trim();
    const uPw = document.getElementById("loginPw").value.trim();

    if (!uId || !uPw) {
      return alert("아이디와 비밀번호를 모두 입력해주세요!");
    }

    // 👑 관리자 로그인 처리 (admin / admin)
    if (uId === "admin" && uPw === "admin") {
      localStorage.setItem("elementary_studentId", "admin");
      localStorage.setItem("elementary_studentName", "관리자");
      localStorage.setItem("elementary_isAdmin", "true");
      alert("👑 관리자 계정으로 로그인했습니다!\n관리자 페이지로 이동합니다.");
      window.location.href = "admin.html";
      return;
    }

    // 일반 학생 로그인 처리
    try {
      const userRef = doc(db, "students", uId);
      const userSnap = await getDoc(userRef);

      if (!userSnap.exists()) {
        return alert("존재하지 않는 아이디입니다. '계정 생성' 탭에서 새 계정을 만들어주세요!");
      }

      const userData = userSnap.data();
      if (userData.password && userData.password !== uPw) {
        return alert("비밀번호가 올바르지 않습니다. 다시 확인해주세요!");
      }

      // 로그인 성공 ➔ localStorage 저장
      localStorage.setItem("elementary_studentId", uId);
      localStorage.setItem("elementary_studentName", userData.studentName || uId);
      localStorage.setItem("elementary_aiName", userData.aiPartnerName || "에코봇");
      localStorage.removeItem("elementary_isAdmin");

      window.location.href = "main.html";
    } catch (e) {
      console.error(e);
      alert("로그인 중 오류가 발생했습니다: " + e.message);
    }
  });

  // 2. 계정 생성 (회원가입) 처리
  document.getElementById("signupSubmitBtn").addEventListener("click", async () => {
    const sId = document.getElementById("signupId").value.trim();
    const sPw = document.getElementById("signupPw").value.trim();
    const sPwConfirm = document.getElementById("signupPwConfirm").value.trim();
    const nickname = document.getElementById("signupNickname").value.trim();
    const aiName = document.getElementById("signupAiName").value.trim() || "에코봇";

    if (!sId) return alert("사용할 아이디를 입력해주세요!");
    if (!sPw) return alert("비밀번호를 입력해주세요!");
    if (sPw !== sPwConfirm) return alert("비밀번호와 비밀번호 확인이 서로 일치하지 않습니다!");
    if (!nickname) return alert("사용할 닉네임(학생 이름)을 입력해주세요!");

    try {
      const userRef = doc(db, "students", sId);
      const userSnap = await getDoc(userRef);

      if (userSnap.exists()) {
        return alert("이미 사용 중인 아이디입니다. 다른 아이디를 입력해주세요!");
      }

      // Firestore에 새 사용자 계정 생성 (비밀번호 및 기본 정보 포함)
      await setDoc(userRef, {
        studentId: sId,
        password: sPw,
        studentName: nickname,
        aiPartnerName: aiName,
        score: 10,
        badge: "신입 탐정",
        questsDone: 0,
        createdAt: serverTimestamp(),
        lastActive: serverTimestamp()
      });

      localStorage.setItem("elementary_studentId", sId);
      localStorage.setItem("elementary_studentName", nickname);
      localStorage.setItem("elementary_aiName", aiName);
      localStorage.removeItem("elementary_isAdmin");

      alert(`🎉 계정이 성공적으로 생성되었습니다!\n환영합니다, ${nickname} 탐정님!`);
      window.location.href = "main.html";
    } catch (e) {
      console.error(e);
      alert("계정 생성 중 오류가 발생했습니다: " + e.message);
    }
  });
</script>
</body>
</html>
