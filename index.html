<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 자원순환 탐정단 - 입장</title>
  <!-- 저작권 무료 폰트: Pretendard 및 Google Fonts Jua -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #2E7D32;
      --primary-dark: #1B5E20;
      --accent-color: #FFB300;
      --bg-color: #E8F5E9;
      --card-bg: #FFFFFF;
      --text-main: #1A237E;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background: linear-gradient(135deg, #E8F5E9, #C8E6C9);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .login-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 520px;
      padding: 36px 28px;
      border-radius: 28px;
      box-shadow: 0 16px 36px rgba(46, 125, 50, 0.15);
      text-align: center;
      border: 3px solid #A5D6A7;
    }

    .badge-icon {
      font-size: 60px;
      margin-bottom: 8px;
      animation: bounce 2s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h1 {
      font-family: 'Jua', sans-serif;
      font-size: 32px;
      color: var(--primary-color);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    p.sub {
      font-size: 16px;
      font-weight: 600;
      color: #558B2F;
      margin-bottom: 24px;
      background: #F1F8E9;
      padding: 8px 16px;
      border-radius: 20px;
      display: inline-block;
    }

    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-family: 'Jua', sans-serif;
      font-size: 18px;
      color: #2E7D32;
      margin-bottom: 6px;
    }

    input[type="text"] {
      width: 100%;
      padding: 16px 18px;
      border: 3px solid #C8E6C9;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 600;
      color: #1B5E20;
      outline: none;
      transition: all 0.2s;
      background: #FAFAFA;
    }

    input[type="text"]:focus {
      border-color: var(--primary-color);
      background: #FFFFFF;
      box-shadow: 0 0 0 4px rgba(46, 125, 50, 0.15);
    }

    .btn-group {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-start {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #4CAF50, #2E7D32);
      color: white;
      border: none;
      border-radius: 18px;
      font-family: 'Jua', sans-serif;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(46, 125, 50, 0.3);
      transition: all 0.2s;
    }

    .btn-start:active {
      transform: translateY(2px);
      box-shadow: 0 2px 8px rgba(46, 125, 50, 0.3);
    }

    .btn-guest {
      width: 100%;
      padding: 16px;
      background-color: #ECEFF1;
      color: #37474F;
      border: 2px solid #CFD8DC;
      border-radius: 18px;
      font-family: 'Jua', sans-serif;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-guest:active {
      background-color: #CFD8DC;
    }

    /* 웨일북 및 스마트기기 대응 레이아웃 */
    @media (max-width: 480px) {
      .login-card { padding: 24px 18px; }
      h1 { font-size: 26px; }
      label { font-size: 16px; }
      input[type="text"] { font-size: 16px; padding: 14px; }
      .btn-start { font-size: 19px; padding: 16px; }
      .btn-guest { font-size: 17px; padding: 14px; }
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="badge-icon">🌱🕵️‍♂️</div>
  <h1>AI 자원순환 탐정단</h1>
  <p class="sub">초등 5학년 AI 디지털 교과서</p>

  <div class="form-group">
    <label for="studentId">📌 학번 (예: 50105)</label>
    <input type="text" id="studentId" placeholder="학년·반·번호 입력 (예: 50105)">
  </div>
  
  <div class="form-group">
    <label for="studentName">👤 학생 이름</label>
    <input type="text" id="studentName" placeholder="이름 입력 (예: 홍길동)">
  </div>
  
  <div class="form-group">
    <label for="aiName">🤖 나만의 AI 파트너 이름</label>
    <input type="text" id="aiName" placeholder="예: 에코봇">
  </div>

  <div class="btn-group">
    <button class="btn-start" id="startBtn">탐정단 등록 후 탐정 마을 입장 🚀</button>
    <button class="btn-guest" id="guestBtn">⚡ 체험용 임시 입장 (메인 화면으로 바로가기)</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCdx4xwK3XIzgw_4hFEohnMe64dc4LDB00",
    authDomain: "elemeelementary-textbook.firebaseapp.com",
    projectId: "elemeelementary-textbook",
    storageBucket: "elemeelementary-textbook.firebasestorage.app",
    messagingSenderId: "713149004420",
    appId: "1:713149004420:web:8483273681e16f5a8fa0d1",
    measurementId: "G-TZT282J9E8"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // 일반 탐정 등록
  document.getElementById("startBtn").addEventListener("click", async () => {
    const sId = document.getElementById("studentId").value.trim();
    const sName = document.getElementById("studentName").value.trim();
    const ai = document.getElementById("aiName").value.trim() || "에코봇";

    if (!sId || !sName) return alert("학번과 학생 이름을 입력해주세요!");

    try {
      await setDoc(doc(db, "students", sId), {
        studentId: sId,
        studentName: sName,
        aiPartnerName: ai,
        score: 10,
        badge: "신입 탐정",
        lastActive: serverTimestamp()
      }, { merge: true });
    } catch (e) {
      console.error(e);
    }

    localStorage.setItem("elementary_studentId", sId);
    localStorage.setItem("elementary_studentName", sName);
    localStorage.setItem("elementary_aiName", ai);
    
    // 메인 화면으로 직접 이동
    window.location.href = "main.html";
  });

  // 체험용 임시 입장 ➔ 사전 설문 없이 메인화면으로 바로 이동
  document.getElementById("guestBtn").addEventListener("click", () => {
    const guestId = "Guest_" + Math.floor(Math.random() * 1000);
    localStorage.setItem("elementary_studentId", guestId);
    localStorage.setItem("elementary_studentName", "체험탐정");
    localStorage.setItem("elementary_aiName", "에코봇");
    
    // 사전 설문 없이 메인 화면으로 바로 이동
    window.location.href = "main.html";
  });
</script>
</body>
</html>
