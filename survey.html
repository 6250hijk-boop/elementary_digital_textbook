<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 자원순환 탐정단 - 사전 설문조사</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    :root {
      --primary: #2E7D32;
      --primary-light: #E8F5E9;
      --border: #CFD8DC;
      --text: #263238;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    body {
      background-color: #ECEFF1;
      color: var(--text);
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background: #FFFFFF;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      overflow: hidden;
      padding: 24px;
    }

    header {
      text-align: center;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--primary-light);
      margin-bottom: 20px;
    }
    h1 { font-size: 20px; color: var(--primary); margin-bottom: 6px; }
    p.guide { font-size: 13px; color: #546E7A; line-height: 1.5; }

    .student-badge {
      display: inline-block;
      background: var(--primary-light);
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
      margin-top: 10px;
    }

    .question-card {
      background: #FAFAFA;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .question-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 12px;
      line-height: 1.4;
      color: #1E2D1F;
    }

    /* 5점 척도 라디오 버튼 그룹 */
    .scale-group {
      display: flex;
      justify-content: space-between;
      gap: 4px;
    }
    .scale-item {
      flex: 1;
      text-align: center;
    }
    .scale-item input[type="radio"] {
      display: none;
    }
    .scale-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 4px;
      border: 2px solid #E0E0E0;
      border-radius: 10px;
      background: white;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 12px;
      font-weight: bold;
    }
    .scale-item input[type="radio"]:checked + .scale-label {
      border-color: var(--primary);
      background-color: var(--primary-light);
      color: var(--primary);
      transform: scale(1.03);
    }
    .scale-text {
      font-size: 10px;
      color: #78909C;
      margin-top: 4px;
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(46, 125, 50, 0.3);
      transition: background 0.2s;
    }
    .btn-submit:hover { background: #1B5E20; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>사전 검사 설문조사</h1>
    <p class="guide">AI 자원순환 탐정단 활동을 시작하기 전 여러분의 생각을 솔직하게 답변해주세요.</p>
    <div class="student-badge" id="dispStudent">학생 정보 로딩 중...</div>
  </header>

  <form id="surveyForm">
    <!-- 10개 문항 -->
    <div id="questionsContainer"></div>

    <button type="submit" class="btn-submit" id="submitBtn">설문 제출하고 탐정 마을 입장하기</button>
  </form>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCdx4xwK3XIzgw_4hFEohnMe64dc4LDB00",
    authDomain: "elemeelementary-textbook.firebaseapp.com",
    projectId: "elemeelementary-textbook",
    storageBucket: "elemeelementary-textbook.firebasestorage.app",
    messagingSenderId: "713149004420",
    appId: "1:713149004420:web:8483273681e16f5a8fa0d1",
    measurementId: "G-TZT282J9E8"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const studentId = localStorage.getItem("elementary_studentId");
  const studentName = localStorage.getItem("elementary_studentName") || "탐정";

  if (!studentId) {
    window.location.href = "index.html";
  }

  document.getElementById("dispStudent").textContent = `${studentName} (${studentId}) 학생`;

  // 연구계획서 역량 기반 10개 설문 문항
  const questions = [
    "1. [AI리터러시] 나는 AI가 알려주는 정보를 그대로 받아들이지 않고 스스로 판단할 수 있다.",
    "2. [AI활용 문제해결력] 나는 문제를 해결하기 위해 AI를 활용할 수 있다.",
    "3. [학습 유용성] 나는 AI를 활용한 수업이 공부에 도움이 된다고 생각한다.",
    "4. [협업 역량] 나는 AI를 활용한 수업에서 친구들과 협력하여 활동할 수 있다.",
    "5. [AI학습 원리이해] 나는 AI가 이름표가 붙은 많은 사진을 보고 배운다는 것을 설명할 수 있다.",
    "6. [데이터 리터러시] 나는 AI가 잘 배울 수 있는 좋은 사진과 그렇지 않은 사진을 구별할 수 있다.",
    "7. [AI오류 분석] 나는 AI가 물건을 잘 못 알아보았을 때 그 까닭을 찾아 말할 수 있다.",
    "8. [AI활용 책임] 나는 AI를 사용할 때 마지막 판단은 사람이 해야한다고 생각한다.",
    "9. [자원순환 인식] 나는 분리배출을 올바르게 하면 자원을 다시 쓸 수 있다는 것을 설명할 수 있다.",
    "10. [분리배출 실천] 나는 헷갈리는 쓰레기를 버리기 전에 올바른 방법을 확인한다."
  ];

  const scaleTexts = ["전혀 아니다", "아니다", "보통이다", "그렇다", "매우 그렇다"];
  const container = document.getElementById("questionsContainer");

  questions.forEach((q, idx) => {
    const qNum = idx + 1;
    const card = document.createElement("div");
    card.className = "question-card";

    let scaleHtml = `<div class="question-title">${q}</div><div class="scale-group">`;
    for (let score = 1; score <= 5; score++) {
      scaleHtml += `
        <div class="scale-item">
          <input type="radio" id="q${qNum}_s${score}" name="q${qNum}" value="${score}" required>
          <label class="scale-label" for="q${qNum}_s${score}">
            <div>${score}점</div>
            <div class="scale-text">${scaleTexts[score - 1]}</div>
          </label>
        </div>
      `;
    }
    scaleHtml += `</div>`;
    card.innerHTML = scaleHtml;
    container.appendChild(card);
  });

  document.getElementById("surveyForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById("submitBtn");
    submitBtn.disabled = true;
    submitBtn.textContent = "설문 제출 중...";

    const answers = {};
    let totalScore = 0;
    for (let i = 1; i <= 10; i++) {
      const checked = document.querySelector(`input[name="q${i}"]:checked`);
      const val = checked ? parseInt(checked.value, 10) : 0;
      answers[`q${i}`] = val;
      totalScore += val;
    }

    const teamCode = localStorage.getItem("elementary_teamCode") || localStorage.getItem("teamCode") || "1모둠";

    try {
      // Firebase Firestore의 pre_surveys 컬렉션에 학번을 문서 ID로 저장
      await setDoc(doc(db, "pre_surveys", studentId), {
        studentId: studentId,
        studentName: studentName,
        teamCode: teamCode,
        answers: answers,
        totalScore: totalScore,
        avgScore: Math.round((totalScore / 10) * 10) / 10,
        submittedAt: serverTimestamp()
      });

      // 학생 문서에도 사전설문 완료 기록
      await setDoc(doc(db, "students", studentId), {
        preSurveyDone: true,
        lastActive: serverTimestamp()
      }, { merge: true });

      // 설문 완료 플래그 로컬 저장
      localStorage.setItem("elementary_surveyDone", "true");
      alert("사전 설문조사가 완료되었습니다! 메인화면으로 이동합니다.");
      window.location.href = "main.html";
    } catch (err) {
      console.error(err);
      alert("설문 저장 중 오류가 발생했습니다: " + err.message);
      submitBtn.disabled = false;
      submitBtn.textContent = "설문 제출하고 메인화면 입장하기";
    }
  });
</script>
</body>
</html>
