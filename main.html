<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 자원순환 탐정단 - 8대 퀘스트 지도</title>
  <script>
    // localhost 상의 다른 PWA 서비스 워커 및 캐시 충돌 자동 해제
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        for (const reg of regs) reg.unregister();
      });
    }
    if ('caches' in window) {
      caches.keys().then(keys => {
        for (const k of keys) caches.delete(k);
      });
    }
  </script>
  <!-- 저작권 무료 폰트: Pretendard 및 Google Fonts Jua 사용 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #2E7D32;
      --accent: #FFB300;
      --text-dark: #263238;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 0;
      background: #0F172A;
      overflow: hidden; /* 스크롤바 완전히 제거 */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 메인 퀘스트 대지도 맵 - 화면 종횡비에 맞춰 스크롤 없이 자동 맞춤 */
    .quest-map-container {
      position: relative;
      /* 화면이 좁을 땐 좌우폭(100vw)에 맞추고, 상하가 좁을 땐 상하폭(100vh)에 자동 맞춤 */
      width: min(100vw, calc(100vh * (2704 / 1568)));
      width: min(100vw, calc(100dvh * (2704 / 1568)));
      height: min(100vh, calc(100vw * (1568 / 2704)));
      height: min(100dvh, calc(100vw * (1568 / 2704)));
      aspect-ratio: 2704 / 1568;
      max-width: 100vw;
      max-height: 100vh;
      max-height: 100dvh;
      margin: auto;
      padding: 0;
      user-select: none;
      background: #000000;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      container-type: inline-size;
    }

    .quest-map-img {
      width: 100%;
      height: 100%;
      display: block;
      vertical-align: middle;
      object-fit: fill;
      pointer-events: none;
    }

    .quest-hotspot {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 10;
      overflow: visible;
    }

    .hotspot-full-img {
      height: 100%;
      width: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.3));
      transition: all 0.25s ease;
      pointer-events: none;
    }

    .quest-hotspot:hover, .quest-hotspot:focus {
      transform: scale(1.08);
      z-index: 25;
    }

    .quest-hotspot:hover .hotspot-full-img {
      filter: drop-shadow(0 0 16px rgba(250, 204, 21, 0.95)) drop-shadow(0 6px 14px rgba(0, 0, 0, 0.35));
    }

    .quest-hotspot.is-completed .hotspot-full-img {
      filter: drop-shadow(0 4px 12px rgba(34, 197, 94, 0.45));
    }

    .quest-hotspot.is-completed:hover .hotspot-full-img {
      filter: drop-shadow(0 0 18px rgba(34, 197, 94, 0.95)) drop-shadow(0 6px 14px rgba(0, 0, 0, 0.35));
    }

    .quest-hotspot:active {
      transform: scale(0.96);
    }

    .hotspot-pulse {
      position: absolute;
      inset: 0;
      border-radius: 14px;
      border: 2px solid rgba(250, 204, 21, 0.6);
      animation: hotspotGlow 2s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes hotspotGlow {
      0% {
        box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.4);
        border-color: rgba(250, 204, 21, 0.3);
      }
      50% {
        box-shadow: 0 0 14px 4px rgba(250, 204, 21, 0.7);
        border-color: rgba(234, 179, 8, 0.9);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(250, 204, 21, 0);
        border-color: rgba(250, 204, 21, 0.3);
      }
    }

    .hotspot-title-overlay {
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.92), rgba(30, 41, 59, 0.95));
      color: #FEF08A;
      font-size: clamp(10px, 1.35cqi, 16px);
      font-weight: 800;
      font-family: 'Jua', sans-serif;
      padding: 3px 8px;
      border-radius: 12px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 1;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
      border: 2px solid #FACC15;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      z-index: 25;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .quest-hotspot:hover .hotspot-title-overlay,
    .quest-hotspot:focus .hotspot-title-overlay {
      transform: translateX(-50%) translateY(-3px) scale(1.08);
      background: linear-gradient(135deg, #1E293B, #0F172A);
      border-color: #FFFFFF;
      color: #FFFFFF;
      box-shadow: 0 0 18px rgba(250, 204, 21, 0.9), 0 6px 16px rgba(0, 0, 0, 0.5);
    }

    .quest-hotspot.is-completed .hotspot-title-overlay {
      border-color: #4ADE80;
      color: #DCFCE7;
    }

    .quest-hotspot.is-pending .hotspot-full-img {
      filter: drop-shadow(0 0 14px rgba(245, 158, 11, 0.85)) drop-shadow(0 4px 10px rgba(0, 0, 0, 0.35));
      animation: pendingHotspotGlow 1.8s infinite ease-in-out;
    }

    @keyframes pendingHotspotGlow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.7)); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 18px rgba(245, 158, 11, 1)); }
    }

    .quest-hotspot.is-pending .hotspot-title-overlay {
      border-color: #F59E0B;
      color: #FEF3C7;
      background: linear-gradient(135deg, rgba(69, 26, 3, 0.95), rgba(120, 53, 15, 0.95));
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.75);
    }

    .quest-hotspot.is-completed:hover .hotspot-title-overlay {
      border-color: #86EFAC;
      box-shadow: 0 0 18px rgba(34, 197, 94, 0.9), 0 6px 16px rgba(0, 0, 0, 0.5);
    }

    /* 우리 모둠 아지트 (My Home) 클릭 네모 스타일 */
    .hotspot-myhome {
      border-radius: 18px;
      z-index: 20;
    }

    .myhome-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 18px;
      border: 3px solid rgba(56, 189, 248, 0.95);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.7);
      transition: all 0.25s ease;
      display: block;
    }

    .hotspot-myhome:hover .myhome-img,
    .hotspot-myhome:focus .myhome-img {
      border-color: #FFFFFF;
      box-shadow: 0 0 32px rgba(56, 189, 248, 1), 0 8px 24px rgba(0, 0, 0, 0.5);
      transform: scale(1.06);
    }

    .myhome-pulse {
      border-color: rgba(56, 189, 248, 0.8) !important;
      animation: myhomePulse 2s infinite ease-in-out !important;
    }

    @keyframes myhomePulse {
      0% {
        box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.5);
        border-color: rgba(56, 189, 248, 0.4);
      }
      50% {
        box-shadow: 0 0 16px 6px rgba(56, 189, 248, 0.85);
        border-color: rgba(125, 211, 252, 1);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(56, 189, 248, 0);
        border-color: rgba(56, 189, 248, 0.4);
      }
    }

    .myhome-overlay {
      border-color: #38BDF8 !important;
      color: #E0F2FE !important;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(3, 105, 161, 0.95)) !important;
    }

    .hotspot-myhome:hover .myhome-overlay {
      border-color: #FFFFFF !important;
      color: #FFFFFF !important;
      box-shadow: 0 0 20px rgba(56, 189, 248, 1) !important;
    }

    /* 잠겨있는 퀘스트 (앞단계 미완료) 스타일 */
    .quest-hotspot.is-locked {
      opacity: 0.55;
      filter: grayscale(85%) contrast(0.85);
      cursor: not-allowed !important;
    }

    .quest-hotspot.is-locked .hotspot-pulse {
      display: none !important;
    }

    .quest-hotspot.is-locked:hover,
    .quest-hotspot.is-locked:focus {
      transform: none !important;
      filter: grayscale(80%) contrast(0.9) !important;
    }

    .quest-hotspot.is-locked .hotspot-title-overlay {
      border-color: #64748B !important;
      color: #94A3B8 !important;
      background: rgba(15, 23, 42, 0.95) !important;
      box-shadow: none !important;
    }
  </style>
</head>
<body>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, updateDoc, onSnapshot, collection, arrayUnion, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCdx4xwK3XIzgw_4hFEohnMe64dc4LDB00",
    authDomain: "elemeelementary-textbook.firebaseapp.com",
    projectId: "elemeelementary-textbook",
    storageBucket: "elemeelementary-textbook.firebasestorage.app",
    messagingSenderId: "713149004420",
    appId: "1:713149004420:web:8483273681e16f5a8fa0d1",
    measurementId: "G-TZT282J9E8"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const teamCode = localStorage.getItem("elementary_teamCode");
  const studentId = localStorage.getItem("elementary_studentId");
  const studentName = localStorage.getItem("elementary_studentName") || "학생 탐정";

  if (!studentId || !teamCode) {
    window.location.href = "index.html";
  }

  // 접속 시 내 이름을 모둠 멤버로 활성화
  if (teamCode && studentName) {
    updateDoc(doc(db, "teams", teamCode), {
      members: arrayUnion(studentName),
      lastActive: serverTimestamp()
    }).catch(e => console.warn(e));
  }

  // 모둠 이름에 따른 아지트 이름 동적 반영
  function updateMyHomeTitle() {
    const overlayEl = document.getElementById("myhomeOverlay");
    const hotspotEl = document.getElementById("hotspot-myhome");
    const currentTeam = localStorage.getItem("elementary_teamCode") || teamCode || "";
    const nameText = currentTeam ? `${currentTeam}의 아지트` : "우리 모둠 아지트";
    if (overlayEl) {
      overlayEl.textContent = `${nameText}`;
    }
    if (hotspotEl) {
      hotspotEl.title = `[${nameText}] 바로가기 (클릭)`;
    }
  }

  // 1. 실시간 퀘스트 승인/완료 상태 동기화 및 맵 아이콘/순차 잠금 업데이트
  let approvedQuestsState = {};
  const submittedQuestsState = {
    q1: false, q2: false, q3: false, q4: false,
    q5: false, q6: false, q7: false, q8: false
  };

  const QUEST_INFO = {
    q1: { name: "Q1. AI의 눈", title: "퀘스트 1: AI의 눈" },
    q2: { name: "Q2. 분류기준", title: "퀘스트 2: 분류기준 만들기" },
    q3: { name: "Q3. 사진수집", title: "퀘스트 3: 사진 데이터 수집" },
    q4: { name: "Q4. 이름표", title: "퀘스트 4: 이름표 붙이기" },
    q5: { name: "Q5. AI탐정", title: "퀘스트 5: 교실쓰레기 AI탐정단" },
    q6: { name: "Q6. 오류관", title: "퀘스트 6: 오류박물관" },
    q7: { name: "Q7. 실천규약", title: "퀘스트 7: 실천 규약 초안" },
    q8: { name: "Q8. 실천하기", title: "퀘스트 8: 실천하기" }
  };

  // 개별 퀘스트 자체의 완료 기록 존재 여부 검사
  function hasQuestCompletionRecord(num) {
    if (num < 1 || num > 8) return false;
    const key = `q${num}`;
    return !!approvedQuestsState[key] || 
           !!submittedQuestsState[key] || 
           (localStorage.getItem(`quest${num}_submitted`) === "true") ||
           (localStorage.getItem(`quest${num}_completed`) === "true") ||
           (localStorage.getItem(`elementary_q${num}_done`) === "true");
  }

  // 특정 퀘스트가 완료(Unlock) 상태인지 검사 (엄격한 순차 검증: 1번부터 num번까지 차례대로 완료되어야만 함)
  function isQuestUnlocked(num) {
    if (num < 1 || num > 8) return false;
    for (let k = 1; k <= num; k++) {
      if (!hasQuestCompletionRecord(k)) {
        return false;
      }
    }
    return true;
  }

  // 특정 퀘스트가 열려있는지(도전 가능한지) 검사
  // 1단계는 항상 열림, 2단계부터는 바로 앞단계(num - 1)가 완료(Unlocked)되어야만 열림
  function isQuestOpen(num) {
    if (num === 1) return true;
    return isQuestUnlocked(num - 1);
  }

  function updateQuestLockImages() {
    updateMyHomeTitle();

    for (let i = 1; i <= 8; i++) {
      const key = `q${i}`;
      const isApproved = !!approvedQuestsState[key];
      const isUnlocked = isQuestUnlocked(i);
      const isOpen = isQuestOpen(i);

      const iconEl = document.getElementById(`icon-q${i}`);
      const hotspotEl = document.getElementById(`hotspot-q${i}`);
      const overlayEl = document.getElementById(`overlay-q${i}`);
      const qMeta = QUEST_INFO[key] || { name: `Q${i}`, title: `퀘스트 ${i}` };

      if (iconEl && hotspotEl) {
        // 앞단계 미완료 퀘스트 클릭 시 친절한 안내 알림창 제공 및 진입 차단
        hotspotEl.onclick = (e) => {
          if (!isQuestOpen(i)) {
            e.preventDefault();
            e.stopPropagation();
            alert(`[${qMeta.name}] 퀘스트는 아직 잠겨있습니다.\n\n앞 단계인 [Q${i-1}. ${QUEST_INFO['q'+(i-1)].name}] 퀘스트를 먼저 완료해야 다음 단계에 도전할 수 있습니다.`);
            return false;
          }
        };

        if (isUnlocked) {
          // 완료된 퀘스트는 unlock.png 이미지로 즉시 변경 및 잠금 해제
          iconEl.src = "images/unlock.png";
          iconEl.alt = "퀘스트 완료됨";
          hotspotEl.classList.add("is-completed");
          hotspotEl.classList.remove("is-locked", "is-pending");
          hotspotEl.title = `[${qMeta.title}] 완료`;
          if (overlayEl) {
            overlayEl.innerHTML = `${qMeta.name} [완료]`;
          }
        } else {
          // 아직 미완료된 퀘스트는 lock.png 이미지
          iconEl.src = "images/lock.png";
          iconEl.alt = "퀘스트 미완료";
          hotspotEl.classList.remove("is-completed", "is-pending");

          if (isOpen) {
            // 앞단계가 완료되어 현재 단계가 열려있는(도전 가능한) 상태
            hotspotEl.classList.remove("is-locked");
            hotspotEl.title = `[${qMeta.title}] 도전하기 (클릭하여 시작)`;
            if (overlayEl) {
              overlayEl.innerHTML = `${qMeta.name}`;
            }
          } else {
            // 앞단계가 아직 완료되지 않아 잠겨있는 상태
            hotspotEl.classList.add("is-locked");
            hotspotEl.title = `[${qMeta.title}] 이전 단계(Q${i-1}) 완료 필요`;
            if (overlayEl) {
              overlayEl.innerHTML = `${qMeta.name} [잠김]`;
            }
          }
        }
      }
    }
  }

  // 모둠(Team) 실시간 구독 (교사 승인 상태 동기화)
  if (teamCode) {
    onSnapshot(doc(db, "teams", teamCode), (docSnap) => {
      if (docSnap.exists()) {
        const d = docSnap.data();
        if (d.aiName) {
          localStorage.setItem("elementary_aiName", d.aiName);
        }
        if (d.score !== undefined) {
          localStorage.setItem("elementary_score", d.score.toString());
        }
        if (d.approvedQuests) {
          for (let i = 1; i <= 8; i++) {
            if (d.approvedQuests[`q${i}`] || d.approvedQuests[`Q${i}`]) {
              approvedQuestsState[`q${i}`] = true;
            }
          }
        }
        updateQuestLockImages();
      }
    });
  }

  // 학생 개별 문서 구독 (완료 퀘스트 및 점수 실시간 동기화)
  if (studentId) {
    onSnapshot(doc(db, "students", studentId), (docSnap) => {
      if (docSnap.exists()) {
        const sd = docSnap.data();
        if (sd.score !== undefined) {
          localStorage.setItem("elementary_score", sd.score.toString());
          localStorage.setItem("studentExp", sd.score.toString());
        }
        if (sd.badge) {
          localStorage.setItem("elementary_badge", sd.badge);
        }
        if (sd.aiPartnerName) {
          localStorage.setItem("elementary_aiName", sd.aiPartnerName);
        }

        const maxDone = sd.questsDone || 0;
        for (let i = 1; i <= 8; i++) {
          const isDone = !!(sd[`q${i}Done`] || sd[`q${i}_done`] || sd[`quest${i}Done`] || sd[`quest${i}_done`] || sd[`quest${i}Completed`] || (maxDone >= i));
          if (isDone) {
            submittedQuestsState[`q${i}`] = true;
            localStorage.setItem(`quest${i}_completed`, "true");
            localStorage.setItem(`quest${i}_submitted`, "true");
            localStorage.setItem(`elementary_q${i}_done`, "true");
          }
        }

        updateQuestLockImages();
      }
    });
  }

  // 초기 로컬 상태 반영
  updateQuestLockImages();

  // Firestore 컬렉션 실시간 구독으로 퀘스트 과제 제출 여부 감지 (본인 또는 모둠원 제출 시 즉시 다음 퀘스트 자동 해금 및 동기화)
  if (studentId || teamCode) {
    const questCollections = [
      { col: "quest1_records", key: "q1", num: 1 },
      { col: "quest2_rules", key: "q2", num: 2 },
      { col: "quest3_data", key: "q3", num: 3 },
      { col: "uploads", key: "q3", num: 3 },
      { col: "quest4_labeling", key: "q4", num: 4 },
      { col: "labels", key: "q4", num: 4 },
      { col: "quest5_logs", key: "q5", num: 5 },
      { col: "quest5_records", key: "q5", num: 5 },
      { col: "quest6_logs", key: "q6", num: 6 },
      { col: "quest6_errors", key: "q6", num: 6 },
      { col: "quest6_museum", key: "q6", num: 6 },
      { col: "quest6_reflections", key: "q6", num: 6 },
      { col: "quest7_rules", key: "q7", num: 7 },
      { col: "quest7_logs", key: "q7", num: 7 },
      { col: "quest8_logs", key: "q8", num: 8 }
    ];

    questCollections.forEach(({ col, key, num }) => {
      try {
        onSnapshot(collection(db, col), (snapshot) => {
          snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            const sidMatch = studentId && (data.studentId === studentId || data.userId === studentId || data.authorName === studentName || data.userName === studentName);
            const teamMatch = teamCode && (data.teamCode === teamCode || data.teamName === teamCode);

            if (sidMatch || teamMatch) {
              submittedQuestsState[key] = true;
              if (sidMatch) {
                localStorage.setItem(`quest${num}_completed`, "true");
                localStorage.setItem(`quest${num}_submitted`, "true");
                localStorage.setItem(`elementary_q${num}_done`, "true");
              }
            }
          });
          updateQuestLockImages();
        }, (err) => console.warn(col, err));
      } catch (e) {
        console.warn("Snapshot error for", col, e);
      }
    });
  }
</script>
</body>
