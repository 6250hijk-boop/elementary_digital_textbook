<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 자원순환 탐정 마을 - 미니맵</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    :root { --primary: #2E7D32; --accent: #FF9800; --bg: #1B261D; --panel: #2C3E2D; --text: #FFFFFF; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; padding: 15px; min-height: 100vh; }
    .container { width: 100%; max-width: 860px; background: var(--panel); border-radius: 20px; border: 4px solid #4CAF50; overflow: hidden; }
    header { background: #1E2D1F; padding: 14px 20px; border-bottom: 3px solid #4CAF50; text-align: center; }
    h1 { font-size: 20px; color: #81C784; margin-bottom: 6px; }
    .status-bar { display: flex; justify-content: space-around; background: rgba(0,0,0,0.3); padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: bold; color: #E8F5E9; }
    .game-wrapper { padding: 15px; display: flex; flex-direction: column; align-items: center; }
    .canvas-container { border: 4px solid #2E7D32; border-radius: 12px; background: #438e44; overflow: hidden; }
    canvas { display: block; image-rendering: pixelated; }
    .controls-wrapper { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 10px; flex-wrap: wrap; }
    .d-pad { display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(2, 44px); gap: 6px; }
    .d-btn { background: #38523A; color: white; border: 2px solid #81C784; border-radius: 8px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .d-up { grid-column: 2; grid-row: 1; }
    .d-left { grid-column: 1; grid-row: 2; }
    .d-down { grid-column: 2; grid-row: 2; }
    .d-right { grid-column: 3; grid-row: 2; }
    .enter-btn { padding: 12px 24px; font-size: 15px; font-weight: bold; border-radius: 10px; border: 2px solid #555; background: #424242; color: #9E9E9E; cursor: not-allowed; transition: 0.2s; }
    .enter-btn.active { background: var(--accent); color: #FFF; border-color: #FFB74D; cursor: pointer; }
    .realtime-board { width: 100%; padding: 15px; background: #233324; border-top: 2px solid #4CAF50; font-size: 13px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🗺️ AI 자원순환 탐정 마을 (실시간 미니맵)</h1>
    <div class="status-bar">
      <span id="dispStudent">학생: 불러오는 중</span>
      <span id="dispAiName">AI 로봇: 불러오는 중</span>
      <span id="dispScore">⭐ 실시간 점수: ...</span>
      <span id="dispBadge">🏅 배지: ...</span>
    </div>
  </header>

  <div class="game-wrapper">
    <div style="font-size: 13px; color: #C8E6C9; margin-bottom: 8px; font-weight: bold;">
      ⌨️ 방향키로 건물의 문(Door)에 다가가면 [입장하기]가 활성화됩니다!
    </div>
    <div class="canvas-container">
      <canvas id="mapCanvas" width="640" height="380"></canvas>
    </div>

    <div class="controls-wrapper">
      <div class="d-pad">
        <button class="d-btn d-up" onclick="movePlayer(0, -16)">▲</button>
        <button class="d-btn d-left" onclick="movePlayer(-16, 0)">◀</button>
        <button class="d-btn d-down" onclick="movePlayer(0, 16)">▼</button>
        <button class="d-btn d-right" onclick="movePlayer(16, 0)">▶</button>
      </div>
      <button id="enterActionBtn" class="enter-btn" onclick="enterBuilding()">건물 문 앞으로 이동하세요</button>
    </div>
  </div>

  <div class="realtime-board">
    <strong>🏆 실시간 학급 탐정단 현황:</strong>
    <span id="liveRanking">데이터 수신 중...</span>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, onSnapshot, collection, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCdx4xwK3XIzgw_4hFEohnMe64dc4LDB00",
    authDomain: "elemeelementary-textbook.firebaseapp.com",
    projectId: "elemeelementary-textbook",
    storageBucket: "elemeelementary-textbook.firebasestorage.app",
    messagingSenderId: "713149004420",
    appId: "1:713149004420:web:8483273681e16f5a8fa0d1",
    measurementId: "G-TZT282J9E8"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const studentId = localStorage.getItem("elementary_studentId");
  const studentName = localStorage.getItem("elementary_studentName");
  const aiName = localStorage.getItem("elementary_aiName") || "에코봇";

  if (!studentId || !studentName) {
    window.location.href = "index.html";
  }

  // 실시간 내 정보 동기화
  onSnapshot(doc(db, "students", studentId), (docSnap) => {
    if (docSnap.exists()) {
      const data = docSnap.data();
      document.getElementById("dispStudent").textContent = `학생: ${data.studentName} (${data.studentId})`;
      document.getElementById("dispAiName").textContent = `AI 로봇: ${data.aiPartnerName || aiName}`;
      document.getElementById("dispScore").textContent = `⭐ 점수: ${data.score || 0}점`;
      document.getElementById("dispBadge").textContent = `🏅 배지: ${data.badge || '신입 탐정'}`;
    }
  });

  // 실시간 랭킹 목록 동기화
  const rankQ = query(collection(db, "students"), orderBy("score", "desc"), limit(4));
  onSnapshot(rankQ, (snapshot) => {
    const list = [];
    snapshot.forEach(d => list.push(`${d.data().studentName}(${d.data().score || 0}점)`));
    document.getElementById("liveRanking").textContent = list.join(" ｜ ") || "등록된 학생 없음";
  });

  /* 픽셀 엔진 */
  const canvas = document.getElementById("mapCanvas");
  const ctx = canvas.getContext("2d");
  const enterBtn = document.getElementById("enterActionBtn");

  let player = { x: 320, y: 190, speed: 16 };
  const buildings = [
    { id: "quest1.html", name: "1. AI 시선", x: 50,  y: 30,  w: 120, h: 80, roofColor: "#3F51B5", wallColor: "#E8EAF6", doorX: 100, doorY: 110 },
    { id: "quest2.html", name: "2. 기준 작성", x: 260, y: 30,  w: 120, h: 80, roofColor: "#E65100", wallColor: "#FFF3E0", doorX: 310, doorY: 110 },
    { id: "quest3.html", name: "3. 데이터 선별", x: 470, y: 30,  w: 120, h: 80, roofColor: "#00796B", wallColor: "#E0F2F1", doorX: 520, doorY: 110 },
    { id: "quest4.html", name: "4. 라벨링 미션", x: 50,  y: 250, w: 120, h: 80, roofColor: "#2E7D32", wallColor: "#E8F5E9", doorX: 100, doorY: 250 },
    { id: "quest5.html", name: "5. 탐지 비교", x: 260, y: 250, w: 120, h: 80, roofColor: "#6A1B9A", wallColor: "#F3E5F5", doorX: 310, doorY: 250 },
    { id: "quest6.html", name: "6. 실천 규약", x: 470, y: 250, w: 120, h: 80, roofColor: "#C62828", wallColor: "#FFEBEE", doorX: 520, doorY: 250 }
  ];

  let currentTarget = null;

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // 잔디
    for (let x = 0; x < canvas.width; x += 16) {
      for (let y = 0; y < canvas.height; y += 16) {
        ctx.fillStyle = ((x / 16 + y / 16) % 2 === 0) ? "#4CAF50" : "#43A047";
        ctx.fillRect(x, y, 16, 16);
      }
    }
    // 자갈 도로
    ctx.fillStyle = "#BCAAA4";
    ctx.fillRect(0, 160, canvas.width, 40);
    ctx.fillRect(90, 110, 40, 140);
    ctx.fillRect(300, 110, 40, 140);
    ctx.fillRect(510, 110, 40, 140);

    // 건물
    buildings.forEach(b => {
      ctx.fillStyle = b.wallColor;
      ctx.fillRect(b.x, b.y + 20, b.w, b.h - 20);
      ctx.fillStyle = b.roofColor;
      ctx.fillRect(b.x - 4, b.y, b.w + 8, 22);
      ctx.fillStyle = "#5D4037"; // 문
      ctx.fillRect(b.doorX - 10, b.y + b.h - 24, 20, 24);

      ctx.fillStyle = "rgba(0,0,0,0.8)";
      ctx.fillRect(b.x, b.y - 16, b.w, 15);
      ctx.font = "bold 10px 'Pretendard'";
      ctx.fillStyle = "#FFF";
      ctx.textAlign = "center";
      ctx.fillText(b.name, b.x + b.w / 2, b.y - 5);
    });

    // 플레이어
    ctx.font = "28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("🕵️‍♂️", player.x, player.y);
  }

  window.movePlayer = function(dx, dy) {
    player.x = Math.max(20, Math.min(canvas.width - 20, player.x + dx));
    player.y = Math.max(30, Math.min(canvas.height - 30, player.y + dy));
    render();

    currentTarget = null;
    buildings.forEach(b => {
      if (Math.hypot(player.x - b.doorX, player.y - b.doorY) < 26) currentTarget = b;
    });

    if (currentTarget) {
      enterBtn.classList.add("active");
      enterBtn.textContent = `🚪 [${currentTarget.name}] 입장하기 (Space)`;
    } else {
      enterBtn.classList.remove("active");
      enterBtn.textContent = "건물 문 앞으로 이동하세요";
    }
  };

  window.enterBuilding = function() {
    if (currentTarget) window.location.href = currentTarget.id;
  };

  window.addEventListener("keydown", (e) => {
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
      e.preventDefault();
      if (e.key === "ArrowUp") movePlayer(0, -player.speed);
      if (e.key === "ArrowDown") movePlayer(0, player.speed);
      if (e.key === "ArrowLeft") movePlayer(-player.speed, 0);
      if (e.key === "ArrowRight") movePlayer(player.speed, 0);
    } else if (e.code === "Space" || e.key === "Enter") {
      e.preventDefault();
      enterBuilding();
    }
  });

  render();
</script>
</body>
</html>
