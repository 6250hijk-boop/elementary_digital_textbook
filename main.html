<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 자원순환 탐정 마을</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    :root {
      --poke-bg: #2b3a42;
      --poke-panel: #3f5159;
      --poke-border: #182328;
      --poke-accent: #fbc02d;
      --btn-red: #e53935;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--poke-bg);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      min-height: 100vh;
      user-select: none;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: var(--poke-panel);
      border-radius: 18px;
      border: 4px solid var(--poke-border);
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 상단 상태 바 */
    header {
      width: 100%;
      background: #1e282d;
      padding: 10px 15px;
      border-bottom: 3px solid var(--poke-border);
      text-align: center;
    }
    h1 {
      font-size: 18px;
      color: #ffeb3b;
      margin-bottom: 4px;
      text-shadow: 2px 2px 0px #000;
    }
    .status-bar {
      display: flex;
      justify-content: space-around;
      background: rgba(0,0,0,0.4);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      color: #eceff1;
      border: 1px solid #37474f;
      flex-wrap: wrap;
      gap: 4px;
    }

    /* 캔버스 맵 영역 */
    .game-wrapper {
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .canvas-container {
      position: relative;
      border: 4px solid #263238;
      border-radius: 12px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
      overflow: hidden;
      background: #78c850;
      width: 100%;
      max-width: 800px;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      image-rendering: pixelated;
    }

    /* 모바일 컨트롤러 */
    .mobile-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 800px;
      margin-top: 12px;
      padding: 10px 15px;
      background: #1e282d;
      border-radius: 14px;
      border: 2px solid #37474f;
      gap: 15px;
    }

    /* 십자키 조이스틱 */
    .d-pad {
      display: grid;
      grid-template-columns: repeat(3, 48px);
      grid-template-rows: repeat(3, 48px);
      gap: 3px;
    }
    .d-btn {
      background: #37474f;
      color: #eceff1;
      border: 2px solid #546e7a;
      border-radius: 8px;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 0 #182328;
    }
    .d-btn:active {
      background: #ff9800;
      color: #fff;
      transform: translateY(2px);
      box-shadow: 0 1px 0 #182328;
    }
    .d-up { grid-column: 2; grid-row: 1; }
    .d-left { grid-column: 1; grid-row: 2; }
    .d-center { grid-column: 2; grid-row: 2; background: #263238; border: none; box-shadow: none; }
    .d-right { grid-column: 3; grid-row: 2; }
    .d-down { grid-column: 2; grid-row: 3; }

    /* 대형 액션 버튼 */
    .action-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      flex: 1;
    }
    .btn-action-a {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle, #f44336, #c62828);
      border: 4px solid #ffcdd2;
      color: white;
      font-size: 20px;
      font-weight: 900;
      box-shadow: 0 5px 0 #5f0909, 0 8px 15px rgba(0,0,0,0.4);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: 0.1s;
    }
    .btn-action-a:active, .btn-action-a.ready {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #5f0909, 0 0 15px #ff9800;
      background: radial-gradient(circle, #ff9800, #e65100);
    }
    .btn-action-a span { font-size: 11px; font-weight: normal; margin-top: -2px; }

    /* 실시간 랭킹 */
    .realtime-board {
      width: 100%;
      padding: 10px 15px;
      background: #1b2428;
      border-top: 3px solid var(--poke-border);
      font-size: 12px;
      color: #b0bec5;
      text-align: center;
    }
    .realtime-board strong { color: #ffca28; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>AI 자원순환 탐정 마을</h1>
    <div class="status-bar">
      <span id="dispStudent">학생: 불러오는 중</span>
      <span id="dispAiName">AI 로봇: 불러오는 중</span>
      <span id="dispScore">⭐ 점수: ...</span>
      <span id="dispBadge">🏅 배지: ...</span>
    </div>
  </header>

  <div class="game-wrapper">
    <div class="canvas-container">
      <canvas id="mapCanvas" width="800" height="420"></canvas>
    </div>

    <!-- 모바일 컨트롤러 -->
    <div class="mobile-controls">
      <div class="d-pad">
        <button class="d-btn d-up" onpointerdown="startMove(0, -18, 'up')" onpointerup="stopMove()" onpointerleave="stopMove()">▲</button>
        <button class="d-btn d-left" onpointerdown="startMove(-18, 0, 'left')" onpointerup="stopMove()" onpointerleave="stopMove()">◀</button>
        <div class="d-center"></div>
        <button class="d-btn d-right" onpointerdown="startMove(18, 0, 'right')" onpointerup="stopMove()" onpointerleave="stopMove()">▶</button>
        <button class="d-btn d-down" onpointerdown="startMove(0, 18, 'down')" onpointerup="stopMove()" onpointerleave="stopMove()">▼</button>
      </div>

      <div class="action-group">
        <button id="actionBtn" class="btn-action-a" onclick="enterBuilding()">
          A
          <span>입장(Space)</span>
        </button>
      </div>
    </div>
  </div>

  <div class="realtime-board">
    <strong>🏆 실시간 탐정단 랭킹:</strong>
    <span id="liveRanking">수신 중...</span>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, onSnapshot, collection, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCdx4xwK3XIzgw_4hFEohnMe64dc4LDB00",
    authDomain: "elemeelementary-textbook.firebaseapp.com",
    projectId: "elemeelementary-textbook",
    storageBucket: "elemeelementary-textbook.firebasestorage.app",
    messagingSenderId: "713149004420",
    appId: "1:713149004420:web:8483273681e16f5a8fa0d1",
    measurementId: "G-TZT282J9E8"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const studentId = localStorage.getItem("elementary_studentId");
  const studentName = localStorage.getItem("elementary_studentName") || "탐정";
  const aiName = localStorage.getItem("elementary_aiName") || "에코봇";

  if (!studentId) {
    window.location.href = "index.html";
  }

  // 실시간 점수/배지 동기화
  onSnapshot(doc(db, "students", studentId), (docSnap) => {
    if (docSnap.exists()) {
      const d = docSnap.data();
      document.getElementById("dispStudent").textContent = `학생: ${d.studentName || studentName} (${d.studentId})`;
      document.getElementById("dispAiName").textContent = `AI 로봇: ${d.aiPartnerName || aiName}`;
      document.getElementById("dispScore").textContent = `⭐ 점수: ${d.score || 0}점`;
      document.getElementById("dispBadge").textContent = `🏅 배지: ${d.badge || '신입 탐정'}`;
    }
  });

  // 실시간 랭킹
  const rankQ = query(collection(db, "students"), orderBy("score", "desc"), limit(4));
  onSnapshot(rankQ, (snapshot) => {
    const list = [];
    snapshot.forEach(docSnap => {
      const d = docSnap.data();
      list.push(`${d.studentName}(${d.score || 0}점)`);
    });
    document.getElementById("liveRanking").textContent = list.join(" ｜ ") || "참여 학생 없음";
  });

  /* ================= 픽셀 엔진 ================= */
  const canvas = document.getElementById("mapCanvas");
  const ctx = canvas.getContext("2d");
  const actionBtn = document.getElementById("actionBtn");

  let player = {
    x: 390,
    y: 210,
    speed: 18,
    facing: "down"
  };

  // 6개 차시 건물 + 맨 오른쪽 진도 대시보드 건물(7개 배치)
  const buildings = [
    { id: "quest1.html",    name: "1. AI 시선관",     x: 30,  y: 45,  w: 120, h: 85, roofColor: "#d32f2f", roofShadow: "#9a0007", wallColor: "#fff9c4", doorX: 90,  doorY: 130 },
    { id: "quest2.html",    name: "2. 기준 연구소",   x: 220, y: 45,  w: 120, h: 85, roofColor: "#1976d2", roofShadow: "#004ba0", wallColor: "#e1f5fe", doorX: 280, doorY: 130 },
    { id: "quest3.html",    name: "3. 데이터 선별소", x: 410, y: 45,  w: 120, h: 85, roofColor: "#388e3c", roofShadow: "#00600f", wallColor: "#e8f5e9", doorX: 470, doorY: 130 },
    { id: "quest4.html",    name: "4. 라벨링 체육관", x: 30,  y: 270, w: 120, h: 85, roofColor: "#f57c00", roofShadow: "#bb4d00", wallColor: "#fff3e0", doorX: 90,  doorY: 270 },
    { id: "quest5.html",    name: "5. 탐지 실험실",   x: 220, y: 270, w: 120, h: 85, roofColor: "#7b1fa2", roofShadow: "#4a0072", wallColor: "#f3e5f5", doorX: 280, doorY: 270 },
    { id: "quest6.html",    name: "6. 규약 리그 본부", x: 410, y: 270, w: 120, h: 85, roofColor: "#00796b", roofShadow: "#004c40", wallColor: "#e0f2f1", doorX: 470, doorY: 270 },
    // 맨 오른쪽에 위치한 진도 대시보드 건물
    { id: "dashboard.html", name: "📊 진도 대시보드", x: 630, y: 155, w: 135, h: 90, roofColor: "#fbc02d", roofShadow: "#c49000", wallColor: "#fffde7", doorX: 695, doorY: 245 }
  ];

  let currentTargetBuilding = null;
  let moveInterval = null;

  function drawMapBase() {
    ctx.fillStyle = "#78c850";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 잔디 텍스처
    ctx.fillStyle = "#6bb844";
    for (let x = 0; x < canvas.width; x += 16) {
      for (let y = 0; y < canvas.height; y += 16) {
        if ((x + y) % 32 === 0) ctx.fillRect(x + 2, y + 2, 4, 4);
      }
    }

    // 모래/자갈 도로망
    ctx.fillStyle = "#d8b068";
    ctx.fillRect(0, 175, canvas.width, 50);          // 메인 가로 도로 (우측 끝까지 연결)
    ctx.fillRect(70, 125, 40, 150);                  // Q1-Q4 도로
    ctx.fillRect(260, 125, 40, 150);                 // Q2-Q5 도로
    ctx.fillRect(450, 125, 40, 150);                 // Q3-Q6 도로
    ctx.fillRect(675, 175, 40, 80);                  // 대시보드 진입로

    ctx.fillStyle = "#b89048";
    ctx.fillRect(0, 175, canvas.width, 3);
    ctx.fillRect(0, 222, canvas.width, 3);
  }

  function drawBuildings() {
    buildings.forEach(b => {
      // 건물 본체
      ctx.fillStyle = b.wallColor;
      ctx.fillRect(b.x, b.y + 26, b.w, b.h - 26);
      ctx.strokeStyle = "#37474f";
      ctx.lineWidth = 3;
      ctx.strokeRect(b.x, b.y + 26, b.w, b.h - 26);

      // 지붕
      ctx.fillStyle = b.roofShadow;
      ctx.fillRect(b.x - 4, b.y + 6, b.w + 8, 24);
      ctx.fillStyle = b.roofColor;
      ctx.fillRect(b.x - 4, b.y, b.w + 8, 20);
      ctx.strokeRect(b.x - 4, b.y, b.w + 8, 24);

      // 문
      ctx.fillStyle = "#b0bec5";
      ctx.fillRect(b.doorX - 14, b.y + b.h - 26, 28, 26);
      ctx.strokeRect(b.doorX - 14, b.y + b.h - 26, 28, 26);

      // 창문
      ctx.fillStyle = "#81d4fa";
      ctx.fillRect(b.x + 10, b.y + 38, 20, 18);
      ctx.fillRect(b.x + b.w - 30, b.y + 38, 20, 18);
      ctx.strokeRect(b.x + 10, b.y + 38, 20, 18);
      ctx.strokeRect(b.x + b.w - 30, b.y + 38, 20, 18);

      // 대형 간판 보드
      ctx.fillStyle = "#1e282d";
      ctx.fillRect(b.x - 6, b.y - 24, b.w + 12, 22);
      ctx.strokeStyle = (b.id === "dashboard.html") ? "#ffeb3b" : "#ffd54f";
      ctx.lineWidth = 2;
      ctx.strokeRect(b.x - 6, b.y - 24, b.w + 12, 22);

      ctx.font = "bold 13px 'Pretendard'";
      ctx.fillStyle = (b.id === "dashboard.html") ? "#ffeb3b" : "#ffffff";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(b.name, b.x + b.w / 2, b.y - 13);
    });
  }

  function drawPlayer(x, y) {
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.beginPath();
    ctx.ellipse(x, y + 16, 14, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    // 모자
    ctx.fillStyle = "#e53935";
    ctx.fillRect(x - 11, y - 24, 22, 9);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(x - 13, y - 16, 26, 3);

    // 얼굴
    ctx.fillStyle = "#ffcc80";
    ctx.fillRect(x - 8, y - 13, 16, 12);

    // 눈
    ctx.fillStyle = "#212121";
    if (player.facing === "down") {
      ctx.fillRect(x - 5, y - 9, 3, 4);
      ctx.fillRect(x + 2, y - 9, 3, 4);
    } else if (player.facing === "left") {
      ctx.fillRect(x - 6, y - 9, 3, 4);
    } else if (player.facing === "right") {
      ctx.fillRect(x + 3, y - 9, 3, 4);
    }

    // 몸통
    ctx.fillStyle = "#1e88e5";
    ctx.fillRect(x - 9, y - 1, 18, 12);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(x - 3, y - 1, 6, 12);

    // 바지 & 신발
    ctx.fillStyle = "#37474f";
    ctx.fillRect(x - 8, y + 11, 16, 6);
    ctx.fillStyle = "#d32f2f";
    ctx.fillRect(x - 9, y + 15, 6, 5);
    ctx.fillRect(x + 3, y + 15, 6, 5);

    // 이름표
    ctx.font = "bold 12px 'Pretendard'";
    ctx.fillStyle = "#ffffff";
    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 3;
    ctx.strokeText(studentName, x, y - 32);
    ctx.fillText(studentName, x, y - 32);
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawMapBase();
    drawBuildings();
    drawPlayer(player.x, player.y);
  }

  function executeMove(dx, dy, dir) {
    player.facing = dir;
    player.x = Math.max(25, Math.min(canvas.width - 25, player.x + dx));
    player.y = Math.max(30, Math.min(canvas.height - 30, player.y + dy));
    checkBuildingEntrance();
    render();
  }

  window.startMove = function(dx, dy, dir) {
    if (moveInterval) clearInterval(moveInterval);
    executeMove(dx, dy, dir);
    moveInterval = setInterval(() => {
      executeMove(dx, dy, dir);
    }, 100);
  };

  window.stopMove = function() {
    if (moveInterval) {
      clearInterval(moveInterval);
      moveInterval = null;
    }
  };

  function checkBuildingEntrance() {
    currentTargetBuilding = null;
    buildings.forEach(b => {
      const dist = Math.hypot(player.x - b.doorX, player.y - b.doorY);
      if (dist < 32) {
        currentTargetBuilding = b;
      }
    });

    if (currentTargetBuilding) {
      actionBtn.classList.add("ready");
    } else {
      actionBtn.classList.remove("ready");
    }
  }

  window.enterBuilding = function() {
    if (currentTargetBuilding) {
      window.location.href = currentTargetBuilding.id;
    }
  };

  window.addEventListener("keydown", (e) => {
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
      e.preventDefault();
      if (e.key === "ArrowUp") executeMove(0, -player.speed, "up");
      if (e.key === "ArrowDown") executeMove(0, player.speed, "down");
      if (e.key === "ArrowLeft") executeMove(-player.speed, 0, "left");
      if (e.key === "ArrowRight") executeMove(player.speed, 0, "right");
    } else if (e.code === "Space" || e.key === "Enter") {
      e.preventDefault();
      enterBuilding();
    }
  });

  render();
</script>
</body>
</html>
