<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quest 6 - 오류 분석 및 실천 규약</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    body { background-color: #F0F4F8; color: #2C3E50; padding: 20px; }
    .card { max-width: 650px; margin: 0 auto; background: white; border-radius: 20px; padding: 25px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    h2 { color: #F57F17; margin-bottom: 12px; }
    .guide-box { background: #FFFDE7; border-left: 5px solid #FBC02D; padding: 12px; border-radius: 8px; margin-bottom: 18px; font-size: 14px; line-height: 1.5; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 14px; }
    select, textarea { width: 100%; padding: 12px; border: 2px solid #E0E0E0; border-radius: 10px; font-size: 14px; outline: none; }
    .btn-submit { width: 100%; padding: 14px; background: #F57F17; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-back { display: inline-block; margin-bottom: 12px; color: #666; text-decoration: none; font-size: 14px; font-weight: bold; }
  </style>
</head>
<body>

<div class="card">
  <a href="main.html" class="btn-back">⬅️ 메인 월드로 돌아가기</a>
  <h2>💡 [Quest 6] AI 오류 원인 분석 및 학급 실천 규약</h2>
  <div class="guide-box">AI가 오답을 낸 원인을 데이터 관점에서 진단하고, 학교 생활에서 실천할 자원순환 약속을 정해 보세요.</div>

  <div class="form-group">
    <label>1. AI 오류가 발생한 주요 원인은 무엇인가요?</label>
    <select id="errorReason">
      <option value="데이터 부족">학습 데이터(사진 수)가 부족해서</option>
      <option value="각도 및 조명 문제">빛 반사나 물체가 찌그러진 각도 때문에</option>
      <option value="오염 및 이물질">음식물 등 오염 물질이 묻어 있어서</option>
      <option value="배경 복잡">뒤 배경이 너무 복잡해서</option>
    </select>
  </div>

  <div class="form-group">
    <label>2. 데이터 관점에서의 AI 성능 개선 방안</label>
    <textarea id="improvePlan" rows="2" placeholder="예: 찌그러진 캔과 오염된 용기 사진을 100장 이상 더 수집해 재학습시킨다."></textarea>
  </div>

  <div class="form-group">
    <label>3. 우리 학급 자원순환 실천 규약 (약속)</label>
    <textarea id="classPromise" rows="3" placeholder="예: 우유 급식 후 반드시 물로 깨끗이 헹구고 완전히 펼쳐서 전용 수거함에 모은다."></textarea>
  </div>

  <button class="btn-submit" id="submitBtn">최종 실천 규약 제출 (⭐ +30점 / 마스터 탐정)</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCdx4xwK3XIzgw_4hFEohnMe64dc4LDB00",
    authDomain: "elemeelementary-textbook.firebaseapp.com",
    projectId: "elemeelementary-textbook",
    storageBucket: "elemeelementary-textbook.firebasestorage.app",
    messagingSenderId: "713149004420",
    appId: "1:713149004420:web:8483273681e16f5a8fa0d1",
    measurementId: "G-TZT282J9E8"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const studentId = localStorage.getItem("elementary_studentId");
  const studentName = localStorage.getItem("elementary_studentName");

  document.getElementById("submitBtn").addEventListener("click", async () => {
    const reason = document.getElementById("errorReason").value;
    const improve = document.getElementById("improvePlan").value.trim();
    const promise = document.getElementById("classPromise").value.trim();

    if (!promise) {
      alert("우리 학급 실천 규약을 작성해주세요!");
      return;
    }

    try {
      await addDoc(collection(db, "quest6_final_promises"), {
        studentId, studentName, errorReason: reason, improvementPlan: improve, classPromise: promise, createdAt: serverTimestamp()
      });

      let score = parseInt(localStorage.getItem("elementary_score") || "10", 10) + 30;
      localStorage.setItem("elementary_score", score.toString());
      localStorage.setItem("elementary_badge", "마스터 탐정 ⭐");

      alert("🎉 모든 퀘스트 완료! 마스터 탐정 배지를 획득했습니다. (⭐ +30점)");
      window.location.href = "main.html";
    } catch (e) {
      console.error(e);
      alert("저장 실패");
    }
  });
</script>
</body>
</html>
